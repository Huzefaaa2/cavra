<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA CLI command map</title>
  <desc id="desc">CAVRA CLI command families grouped by runtime, policy, approvals, evidence, registry, operations, release, and demos.</desc>
  <rect width="1200" height="720" fill="#f9fbfd"/>
  <text x="600" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#122033">CAVRA CLI Command Map</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="470" y="310" width="260" height="88" rx="20" fill="#123b5f"/>
    <text x="600" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">cavra</text>
    <text x="600" y="376" text-anchor="middle" font-size="15" fill="#d7edff">one command surface for control</text>
    <g font-size="18" font-weight="700">
      <rect x="90" y="110" width="220" height="82" rx="16" fill="#e8f1ff" stroke="#4f7cc8" stroke-width="2"/><text x="200" y="158" text-anchor="middle" fill="#183b72">evaluate</text>
      <rect x="370" y="110" width="220" height="82" rx="16" fill="#eefbf4" stroke="#2d9b63" stroke-width="2"/><text x="480" y="158" text-anchor="middle" fill="#1f6a43">policy</text>
      <rect x="650" y="110" width="220" height="82" rx="16" fill="#fff5e3" stroke="#d58d1f" stroke-width="2"/><text x="760" y="158" text-anchor="middle" fill="#754200">approval</text>
      <rect x="930" y="110" width="220" height="82" rx="16" fill="#f3efff" stroke="#7c3aed" stroke-width="2"/><text x="1040" y="158" text-anchor="middle" fill="#4c1d95">evidence</text>
      <rect x="90" y="514" width="220" height="82" rx="16" fill="#edf8ff" stroke="#0284c7" stroke-width="2"/><text x="200" y="562" text-anchor="middle" fill="#075985">registry</text>
      <rect x="370" y="514" width="220" height="82" rx="16" fill="#fbecec" stroke="#cc3d3d" stroke-width="2"/><text x="480" y="562" text-anchor="middle" fill="#7f1d1d">runtime</text>
      <rect x="650" y="514" width="220" height="82" rx="16" fill="#eafaf2" stroke="#38a169" stroke-width="2"/><text x="760" y="562" text-anchor="middle" fill="#245a39">release</text>
      <rect x="930" y="514" width="220" height="82" rx="16" fill="#fff8e8" stroke="#c79a2e" stroke-width="2"/><text x="1040" y="562" text-anchor="middle" fill="#755100">ops and demos</text>
    </g>
    <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M470 330 L300 180"/><path d="M520 310 L500 194"/><path d="M650 310 L740 194"/><path d="M730 330 L940 180"/>
      <path d="M470 388 L300 532"/><path d="M520 398 L500 514"/><path d="M650 398 L740 514"/><path d="M730 388 L940 532"/>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#334155"/></marker></defs>
</svg>
