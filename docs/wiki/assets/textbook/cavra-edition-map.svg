<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA Community-first product model</title>
  <desc id="desc">Animated enterprise architecture diagram showing CAVRA Community as the full self-hosted product, CAVRA Managed as the hosted service, Enterprise Subscription as commercial support and packs, and Trial as a temporary evaluator access lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="48%" stop-color="#13213a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="community" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="managed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="subscription" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 900 46px Inter, Arial, sans-serif; fill: #fff; }
      .subtitle { font: 600 19px Inter, Arial, sans-serif; fill: #bfdbfe; }
      .label { font: 900 28px Inter, Arial, sans-serif; fill: #fff; }
      .eyebrow { font: 800 13px Inter, Arial, sans-serif; letter-spacing: .1em; fill: #bae6fd; }
      .body { font: 600 16px Inter, Arial, sans-serif; fill: #dbeafe; }
      .small { font: 600 14px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .card { fill: rgba(15,23,42,.84); stroke-width: 2.5; }
      .flow { stroke-dasharray: 14 18; animation: flow 8s linear infinite; }
      .pulse { animation: pulse 4.8s ease-in-out infinite; transform-origin: center; }
      .access { animation: access 5s ease-in-out infinite; }
      .orbit { animation: orbit 12s linear infinite; transform-origin: 700px 428px; }
      @keyframes flow { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%,100% { opacity:.88; transform: translateY(0); } 50% { opacity:1; transform: translateY(-8px); } }
      @keyframes access { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .flow,.pulse,.access,.orbit { animation: none; } }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1160" cy="128" r="250" fill="#60a5fa" opacity=".09"/>
  <circle cx="210" cy="690" r="280" fill="#2dd4bf" opacity=".09"/>
  <text x="70" y="78" class="title">CAVRA Product Model</text>
  <text x="72" y="116" class="subtitle">Community is the full self-hosted product. Managed operates it. Enterprise Subscription supports it. Trial evaluates it.</text>

  <g class="orbit" opacity=".95">
    <circle cx="700" cy="428" r="250" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="7 16"/>
    <circle cx="950" cy="428" r="8" fill="#67e8f9" filter="url(#glow)"/>
  </g>

  <g class="pulse">
    <rect x="90" y="192" width="480" height="405" rx="30" class="card" stroke="url(#community)"/>
    <text x="125" y="242" class="eyebrow">PUBLIC SELF-HOSTED PRODUCT</text>
    <text x="125" y="288" class="label">CAVRA Community</text>
    <text x="125" y="330" class="body">Full public runtime authority surface.</text>
    <text x="125" y="374" class="small">Runtime decisions, policy evaluation, approvals</text>
    <text x="125" y="406" class="small">Evidence bundles, AISPM, report center, dashboards</text>
    <text x="125" y="438" class="small">Self-hosted tenant model and generic SSO/RBAC hooks</text>
    <text x="125" y="470" class="small">Connector SDK, reference connectors, public policy packs</text>
    <text x="125" y="526" class="eyebrow">IF A PROVIDER IS MISSING</text>
    <text x="125" y="558" class="small">Show requires configuration, not Enterprise-only.</text>
  </g>

  <g class="pulse" style="animation-delay:.6s">
    <rect x="830" y="170" width="420" height="215" rx="30" class="card" stroke="url(#managed)"/>
    <text x="865" y="220" class="eyebrow" fill="#c4b5fd">HOSTED SERVICE</text>
    <text x="865" y="264" class="label">CAVRA Managed</text>
    <text x="865" y="306" class="body">Operated tenant onboarding, policy registry, dashboards, report delivery, audit storage, uptime, support handoff, and billing.</text>
  </g>

  <g class="pulse" style="animation-delay:1.1s">
    <rect x="830" y="435" width="420" height="215" rx="30" class="card" stroke="url(#subscription)"/>
    <text x="865" y="485" class="eyebrow" fill="#fde68a">COMMERCIAL RELATIONSHIP</text>
    <text x="865" y="529" class="label">Enterprise Subscription</text>
    <text x="865" y="571" class="body">Support, SLA, certified connectors, commercial policy packs, compliance packs, implementation help, and private customer operations.</text>
  </g>

  <path d="M570 392 C662 345 720 286 830 278" fill="none" stroke="#93c5fd" stroke-width="4" class="flow"/>
  <path d="M570 462 C668 520 725 553 830 545" fill="none" stroke="#fbbf24" stroke-width="4" class="flow"/>
  <text x="642" y="332" class="small" fill="#bfdbfe">operate</text>
  <text x="645" y="548" class="small" fill="#fde68a">support</text>

  <g class="access">
    <rect x="250" y="656" width="900" height="82" rx="28" fill="rgba(2,6,23,.78)" stroke="#5eead4" stroke-width="3"/>
    <path d="M295 697 H1105" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" class="flow"/>
    <text x="700" y="690" text-anchor="middle" class="eyebrow" fill="#99f6e4">TEMPORARY EVALUATOR ACCESS PATH</text>
    <text x="700" y="722" text-anchor="middle" class="body">CAVRA Trial evaluates Managed or Enterprise Subscription capabilities; it is not a separate code edition.</text>
  </g>
</svg>
