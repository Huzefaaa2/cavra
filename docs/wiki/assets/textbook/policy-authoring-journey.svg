<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA policy authoring journey</title>
  <desc id="desc">Policy authoring flow from threat model to YAML rules, test, explain, sign, rollout, and evidence review.</desc>
  <rect width="1100" height="360" fill="#f8fafc"/>
  <text x="48" y="54" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Policy authoring journey</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14">
    <g transform="translate(60 118)">
      <rect width="132" height="96" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
      <text x="18" y="34" font-weight="700" fill="#0f172a">Threat model</text>
      <text x="18" y="62" fill="#475569">What must</text>
      <text x="18" y="80" fill="#475569">agents not do?</text>
    </g>
    <path d="M200 166h42" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(252 118)">
      <rect width="132" height="96" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
      <text x="18" y="34" font-weight="700" fill="#0369a1">Write YAML</text>
      <text x="18" y="62" fill="#475569">files, commands,</text>
      <text x="18" y="80" fill="#475569">git, MCP</text>
    </g>
    <path d="M392 166h42" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(444 118)">
      <rect width="132" height="96" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
      <text x="18" y="34" font-weight="700" fill="#15803d">Validate</text>
      <text x="18" y="62" fill="#475569">schema check</text>
      <text x="18" y="80" fill="#475569">policy test</text>
    </g>
    <path d="M584 166h42" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(636 118)">
      <rect width="132" height="96" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="18" y="34" font-weight="700" fill="#6d28d9">Explain</text>
      <text x="18" y="62" fill="#475569">show decision</text>
      <text x="18" y="80" fill="#475569">and reasons</text>
    </g>
    <path d="M776 166h42" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(828 118)">
      <rect width="132" height="96" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="34" font-weight="700" fill="#b45309">Sign</text>
      <text x="18" y="62" fill="#475569">keygen, sign,</text>
      <text x="18" y="80" fill="#475569">verify</text>
    </g>
    <path d="M894 224v38H206v-38" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="398" y="296" font-weight="700" fill="#334155">Roll out in audit-only, then enforce after evidence review</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
