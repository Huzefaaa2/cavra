<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Animated AISPM readiness pulse</title>
  <desc id="desc">An animated AISPM readiness diagram showing coverage, evidence, connectors, runtime workflows, tenant isolation, report delivery, and final production readiness converging into a ready decision.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="62%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <style>
      .bg { fill: #08111f; }
      .label { fill: #e0f2fe; font-family: Inter, Arial, sans-serif; }
      .node { fill: #102033; stroke: #38bdf8; stroke-width: 2; }
      .node2 { fill: #13251f; stroke: #34d399; stroke-width: 2; }
      .line { stroke: #38bdf8; stroke-width: 3; opacity: .72; }
      .ring { fill: none; stroke: #34d399; stroke-width: 4; opacity: .3; }
      .spark { fill: #fde68a; }
      @media (prefers-reduced-motion: no-preference) {
        .ring-a { animation: grow 3s ease-out infinite; transform-origin: 600px 340px; }
        .ring-b { animation: grow 3s ease-out infinite 1s; transform-origin: 600px 340px; }
        .ring-c { animation: grow 3s ease-out infinite 2s; transform-origin: 600px 340px; }
        .spark { animation: orbit 8s linear infinite; transform-origin: 600px 340px; }
      }
      @keyframes grow {
        0% { transform: scale(.35); opacity: .85; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(212px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(212px) rotate(-360deg); }
      }
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="label" x="600" y="56" text-anchor="middle" font-size="34" font-weight="800">AISPM Production Readiness Pulse</text>
  <text class="label" x="600" y="88" text-anchor="middle" font-size="17" opacity=".78">Readiness is not a score. It is evidence from every operating surface converging with no blockers.</text>

  <line class="line" x1="600" y1="340" x2="210" y2="170"/>
  <line class="line" x1="600" y1="340" x2="600" y2="140"/>
  <line class="line" x1="600" y1="340" x2="990" y2="170"/>
  <line class="line" x1="600" y1="340" x2="990" y2="510"/>
  <line class="line" x1="600" y1="340" x2="600" y2="550"/>
  <line class="line" x1="600" y1="340" x2="210" y2="510"/>

  <circle class="ring ring-a" cx="600" cy="340" r="190"/>
  <circle class="ring ring-b" cx="600" cy="340" r="190"/>
  <circle class="ring ring-c" cx="600" cy="340" r="190"/>
  <circle cx="600" cy="340" r="118" fill="url(#core)" stroke="#a7f3d0" stroke-width="3"/>
  <text class="label" x="600" y="320" text-anchor="middle" font-size="24" font-weight="800">READY</text>
  <text class="label" x="600" y="350" text-anchor="middle" font-size="16">when every blocker</text>
  <text class="label" x="600" y="374" text-anchor="middle" font-size="16">is closed with evidence</text>

  <g class="label" font-size="16">
    <rect class="node" x="90" y="120" width="240" height="100" rx="14"/>
    <text x="210" y="158" text-anchor="middle" font-weight="700">Runtime Workflows</text>
    <text x="210" y="188" text-anchor="middle">real agent/tool paths</text>

    <rect class="node" x="480" y="90" width="240" height="100" rx="14"/>
    <text x="600" y="128" text-anchor="middle" font-weight="700">Control Coverage</text>
    <text x="600" y="158" text-anchor="middle">agents, repos, MCP, CI</text>

    <rect class="node" x="870" y="120" width="240" height="100" rx="14"/>
    <text x="990" y="158" text-anchor="middle" font-weight="700">Live Connectors</text>
    <text x="990" y="188" text-anchor="middle">SIEM, ITSM, SMTP</text>

    <rect class="node2" x="870" y="460" width="240" height="100" rx="14"/>
    <text x="990" y="498" text-anchor="middle" font-weight="700">Report Delivery</text>
    <text x="990" y="528" text-anchor="middle">audited provider proof</text>

    <rect class="node2" x="480" y="500" width="240" height="100" rx="14"/>
    <text x="600" y="538" text-anchor="middle" font-weight="700">Tenant Isolation</text>
    <text x="600" y="568" text-anchor="middle">no cross-tenant bleed</text>

    <rect class="node2" x="90" y="460" width="240" height="100" rx="14"/>
    <text x="210" y="498" text-anchor="middle" font-weight="700">Signed Evidence</text>
    <text x="210" y="528" text-anchor="middle">fresh, searchable, retained</text>
  </g>
  <circle class="spark" cx="600" cy="340" r="10"/>
</svg>
