  <text x="60" y="108" fill="#76d6b2" font-family="Arial" font-size="18">Before the agent acts, CAVRA decides. AISPM turns decisions into posture.</text>
  <rect x="430" y="220" width="340" height="170" rx="10" fill="#182026" stroke="#76d6b2" stroke-width="3"/>
