  <text x="600" y="323" text-anchor="middle" fill="#c8d2d8" font-family="Arial" font-size="16">Runtime Authority Layer</text>
  <text x="600" y="351" text-anchor="middle" fill="#c8d2d8" font-family="Arial" font-size="16">Policy • Evidence • Approval</text>
  <rect x="430" y="455" width="340" height="110" rx="10" fill="#102722" stroke="#76d6b2" stroke-width="3"/>
  <text x="600" y="497" text-anchor="middle" fill="#eef3f6" font-family="Arial" font-size="26" font-weight="700">AISPM</text>
  <text x="600" y="528" text-anchor="middle" fill="#c8d2d8" font-family="Arial" font-size="15">AI Security Posture Management</text>
  <text x="600" y="550" text-anchor="middle" fill="#c8d2d8" font-family="Arial" font-size="15">Posture • Reports • Release readiness</text>
  <g fill="#151a1e" stroke="#3d4b52" stroke-width="2">
    <rect x="70" y="180" width="260" height="90" rx="8"/>
