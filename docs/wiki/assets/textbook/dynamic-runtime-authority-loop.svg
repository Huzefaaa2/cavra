<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Animated CAVRA runtime authority loop</title>
  <desc id="desc">An animated diagram showing an agent request moving through normalization, policy evaluation, approval routing, enforcement, evidence, and AISPM posture.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#14b8a6"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #08111f; }
      .card { fill: #111827; stroke: #2dd4bf; stroke-width: 2; }
      .card-alt { fill: #172554; stroke: #60a5fa; stroke-width: 2; }
      .text { fill: #e5f7f4; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #a7f3d0; font-family: Inter, Arial, sans-serif; }
      .path { fill: none; stroke: #14b8a6; stroke-width: 4; marker-end: url(#arrow); opacity: .82; }
      .pulse { fill: #facc15; filter: url(#glow); }
      @media (prefers-reduced-motion: no-preference) {
        .pulse {
          animation: pulse-path 7s linear infinite;
          offset-path: path("M160 260 L340 260 L520 260 L700 260 L880 260 L1040 260 L1040 450 L160 450 L160 260");
        }
        .halo { animation: halo 2.4s ease-in-out infinite; transform-origin: 600px 450px; }
      }
      @keyframes pulse-path {
        from { offset-distance: 0%; }
        to { offset-distance: 100%; }
      }
      @keyframes halo {
        0%, 100% { opacity: .25; transform: scale(.96); }
        50% { opacity: .75; transform: scale(1.04); }
      }
    </style>
  </defs>
  <rect class="bg" width="1200" height="640" rx="0"/>
  <text class="text" x="600" y="58" text-anchor="middle" font-size="34" font-weight="800">CAVRA Runtime Authority Loop</text>
  <text class="muted" x="600" y="90" text-anchor="middle" font-size="17">The agent does not move directly to production. It moves through authority, approval, evidence, and posture.</text>

  <g class="text" font-size="15" font-weight="700">
    <rect class="card" x="70" y="210" width="180" height="100" rx="12"/>
    <text x="160" y="250" text-anchor="middle">Agent Request</text>
    <text x="160" y="276" text-anchor="middle" font-weight="400">file, shell, Git, MCP</text>

    <rect class="card" x="300" y="210" width="180" height="100" rx="12"/>
    <text x="390" y="250" text-anchor="middle">Normalize</text>
    <text x="390" y="276" text-anchor="middle" font-weight="400">actor, action, resource</text>

    <rect class="card" x="530" y="210" width="180" height="100" rx="12"/>
    <text x="620" y="250" text-anchor="middle">Evaluate Policy</text>
    <text x="620" y="276" text-anchor="middle" font-weight="400">rules, trust, identity</text>

    <rect class="card" x="760" y="210" width="180" height="100" rx="12"/>
    <text x="850" y="250" text-anchor="middle">Decide</text>
    <text x="850" y="276" text-anchor="middle" font-weight="400">allow, deny, approval</text>

    <rect class="card" x="990" y="210" width="140" height="100" rx="12"/>
    <text x="1060" y="250" text-anchor="middle">Enforce</text>
    <text x="1060" y="276" text-anchor="middle" font-weight="400">caller acts</text>

    <rect class="card-alt" x="710" y="400" width="220" height="100" rx="12"/>
    <text x="820" y="440" text-anchor="middle">Evidence</text>
    <text x="820" y="466" text-anchor="middle" font-weight="400">signed proof and audit</text>

    <rect class="card-alt" x="430" y="400" width="220" height="100" rx="12"/>
    <text x="540" y="440" text-anchor="middle">AISPM</text>
    <text x="540" y="466" text-anchor="middle" font-weight="400">coverage and findings</text>

    <rect class="card-alt" x="150" y="400" width="220" height="100" rx="12"/>
    <text x="260" y="440" text-anchor="middle">Improve Policy</text>
    <text x="260" y="466" text-anchor="middle" font-weight="400">tune, test, sign</text>
  </g>

  <path class="path" d="M250 260 L300 260"/>
  <path class="path" d="M480 260 L530 260"/>
  <path class="path" d="M710 260 L760 260"/>
  <path class="path" d="M940 260 L990 260"/>
  <path class="path" d="M1060 310 L930 400"/>
  <path class="path" d="M710 450 L650 450"/>
  <path class="path" d="M430 450 L370 450"/>
  <path class="path" d="M160 400 L160 310"/>

  <circle class="halo" cx="600" cy="450" r="150" fill="none" stroke="#2dd4bf" stroke-width="4" opacity=".35"/>
  <circle class="pulse" cx="0" cy="0" r="11"/>
  <text class="muted" x="600" y="580" text-anchor="middle" font-size="16">Animation is illustrative. If your renderer disables motion, the static control loop remains accurate.</text>
</svg>
