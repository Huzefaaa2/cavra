<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA transparent agent orchestration</title>
  <desc id="desc">GitHub issues flow through transparent CAVRA agents, CAVRA runtime authority, evidence, approvals, pull requests, and releases.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #14212b; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5f6f; }
      .band { fill: #ffffff; stroke: #ccd7df; stroke-width: 1.5; }
      .band-title { font: 700 16px Arial, sans-serif; fill: #263238; }
      .node { fill: #ffffff; stroke: #607d8b; stroke-width: 1.4; }
      .github { fill: #e8f1f8; stroke: #3b6f8f; }
      .agent { fill: #edf7ed; stroke: #4d8b55; }
      .cavra { fill: #fff2df; stroke: #b36b18; }
      .security { fill: #fae8e8; stroke: #b84242; }
      .release { fill: #eee9fb; stroke: #7256b8; }
      .node-title { font: 700 14px Arial, sans-serif; fill: #17242d; }
      .node-text { font: 400 12px Arial, sans-serif; fill: #435464; }
      .small { font: 400 11px Arial, sans-serif; fill: #526777; }
      .arrow { stroke: #263238; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #7a8d9a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .pill { fill: #f2f6f8; stroke: #c8d4dc; }
      .pill-text { font: 700 11px Arial, sans-serif; fill: #354750; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="60" y="58" class="title">CAVRA Transparent Agent Orchestration</text>
  <text x="60" y="84" class="subtitle">Specialized AI engineering agents act through GitHub while CAVRA enforces policy, evidence, and human approval gates.</text>

