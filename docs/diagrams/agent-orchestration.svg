  <path class="soft-arrow" d="M300 390 L340 250"/>
  <path class="soft-arrow" d="M455 390 L538 250"/>
  <path class="soft-arrow" d="M610 390 L538 250"/>
  <path class="soft-arrow" d="M765 390 L723 250"/>
  <path class="soft-arrow" d="M920 390 L910 250"/>
  <path class="soft-arrow" d="M1075 390 L1108 250"/>

  <rect x="50" y="555" width="1180" height="130" rx="8" class="band"/>
  <text x="70" y="585" class="band-title">CAVRA Runtime Authority</text>

