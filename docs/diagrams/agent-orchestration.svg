  <path class="arrow" d="M640 555 L640 515"/>
  <path class="soft-arrow" d="M640 555 C640 520 724 515 724 250"/>
  <text x="580" y="705" class="small">No fake human identities. Every automated action uses a declared bot identity, manifest scope, CAVRA decision, evidence, and human approval when required.</text>
</svg>
