<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA Go Backend Rollback Rehearsal Evidence</title>
  <desc id="desc">Diagram showing rollback rehearsal evidence flowing into the CAVRA production readiness dashboard before promoted Go backend selection.</desc>
  <rect width="1280" height="720" fill="#071114"/>
  <rect x="48" y="48" width="1184" height="624" rx="18" fill="#0d181c" stroke="#58d6c3" stroke-width="2"/>
  <text x="80" y="104" fill="#eff9f7" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Go Backend Rollback Rehearsal Evidence</text>
  <text x="80" y="142" fill="#9fb8b6" font-family="Inter, Arial, sans-serif" font-size="18">Promoted mode can select Go only after rollback has been rehearsed and dashboarded.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="210" width="210" height="120" rx="10" fill="#10242a" stroke="#58d6c3"/>
    <text x="118" y="258" fill="#eff9f7" font-size="22" font-weight="700">Rollback Plan</text>
    <text x="118" y="290" fill="#9fb8b6" font-size="15">Approved path to</text>
    <text x="118" y="314" fill="#9fb8b6" font-size="15">Python-only mode</text>

    <rect x="386" y="210" width="240" height="120" rx="10" fill="#10242a" stroke="#f7c65c"/>
    <text x="416" y="252" fill="#eff9f7" font-size="22" font-weight="700">Rehearsal Run</text>
    <text x="416" y="284" fill="#9fb8b6" font-size="15">Simulated restore</text>
    <text x="416" y="308" fill="#9fb8b6" font-size="15">Fallback verified</text>

    <rect x="714" y="210" width="250" height="120" rx="10" fill="#10242a" stroke="#58d6c3"/>
    <text x="744" y="252" fill="#eff9f7" font-size="22" font-weight="700">CAVRA API</text>
    <text x="744" y="284" fill="#9fb8b6" font-size="15">/runtime/go-pilot/</text>
    <text x="744" y="308" fill="#9fb8b6" font-size="15">rollback-rehearsal</text>

    <rect x="1022" y="210" width="170" height="120" rx="10" fill="#10242a" stroke="#58d6c3"/>
    <text x="1050" y="252" fill="#eff9f7" font-size="22" font-weight="700">Console</text>
    <text x="1050" y="284" fill="#9fb8b6" font-size="15">Status, SLA,</text>
    <text x="1050" y="308" fill="#9fb8b6" font-size="15">evidence refs</text>

    <path d="M300 270 H378" stroke="#58d6c3" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M628 270 H706" stroke="#58d6c3" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M966 270 H1014" stroke="#58d6c3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="188" y="438" width="902" height="132" rx="12" fill="#081316" stroke="#315861"/>
    <text x="226" y="486" fill="#eff9f7" font-size="24" font-weight="700">Promotion Gate</text>
    <text x="226" y="522" fill="#9fb8b6" font-size="17">Runtime readiness + deployment readiness + promotion evidence + rollback plan + rehearsal evidence</text>
    <text x="226" y="552" fill="#6fe4c3" font-size="17" font-weight="700">If any gate fails, CAVRA falls back to Python and records the blocking reason.</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d6c3"/>
    </marker>
  </defs>
</svg>
