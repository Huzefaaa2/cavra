  <rect x="970" y="596" width="260" height="58" class="box" />
  <text x="992" y="629" class="text">Evidence Console</text>

  <text x="70" y="718" class="warn">Boundary: source code and secrets for private connector behavior stay outside the public Community repository.</text>
</svg>
