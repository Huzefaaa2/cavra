<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA final closeout production pilot intake</title>
  <desc id="desc">Production pilot intake flow from trial evidence through repository, agent, CI/CD, connector, SSO/RBAC, retention, and Enterprise/SaaS handoff planning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#72e2c1"/>
    </marker>
    <style>
      .bg{fill:#081216}
      .title{font:700 30px Arial,sans-serif;fill:#eef7f7}
      .subtitle{font:500 16px Arial,sans-serif;fill:#a9bdc4}
      .box{fill:#101b20;stroke:#39535c;stroke-width:2;rx:8}
      .gate{fill:#12332d;stroke:#72e2c1;stroke-width:2;rx:8}
      .handoff{fill:#1b2430;stroke:#8db8ff;stroke-width:2;rx:8}
      .text{font:700 17px Arial,sans-serif;fill:#f5fbfb}
      .small{font:500 13px Arial,sans-serif;fill:#b8c8cc}
      .line{stroke:#72e2c1;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="54" y="62" class="title">Final Closeout Production Pilot Intake</text>
  <text x="54" y="92" class="subtitle">Convert trial evidence into a scoped Enterprise or SaaS pilot without exposing private implementation.</text>

  <rect x="60" y="150" width="220" height="118" class="gate"/>
  <text x="88" y="190" class="text">Trial Evidence</text>
  <text x="88" y="220" class="small">Sample package, release</text>
  <text x="88" y="242" class="small">criteria, closeout review</text>

  <rect x="340" y="150" width="220" height="118" class="box"/>
  <text x="368" y="190" class="text">Scope Intake</text>
  <text x="368" y="220" class="small">Repositories, agents,</text>
  <text x="368" y="242" class="small">CI/CD, release gates</text>

  <rect x="620" y="150" width="220" height="118" class="box"/>
  <text x="648" y="190" class="text">Readiness Checks</text>
  <text x="648" y="220" class="small">Connectors, SSO/RBAC,</text>
  <text x="648" y="242" class="small">retention, audit handoff</text>

  <rect x="900" y="150" width="220" height="118" class="handoff"/>
  <text x="928" y="190" class="text">Handoff Path</text>
  <text x="928" y="220" class="small">Self-hosted Enterprise,</text>
  <text x="928" y="242" class="small">SaaS, or hybrid pilot</text>

  <path class="line" d="M280 209 H340"/>
  <path class="line" d="M560 209 H620"/>
  <path class="line" d="M840 209 H900"/>

  <rect x="182" y="390" width="260" height="126" class="box"/>
  <text x="214" y="432" class="text">Pilot Plan</text>
  <text x="214" y="462" class="small">Owners, timeline, required</text>
  <text x="214" y="484" class="small">checks, evidence locations</text>

  <rect x="510" y="390" width="260" height="126" class="gate"/>
  <text x="542" y="432" class="text">Success Criteria</text>
  <text x="542" y="462" class="small">Release evidence reviewed,</text>
  <text x="542" y="484" class="small">connectors and retention ready</text>

  <rect x="838" y="390" width="260" height="126" class="handoff"/>
  <text x="870" y="432" class="text">Commercial Decision</text>
  <text x="870" y="462" class="small">Proceed, extend, or pause</text>
  <text x="870" y="484" class="small">with named owners</text>

  <path class="line" d="M1010 268 V326 H312 V390"/>
  <path class="line" d="M442 453 H510"/>
  <path class="line" d="M770 453 H838"/>

  <rect x="302" y="596" width="676" height="72" class="gate"/>
  <text x="334" y="636" class="text">Public Package, Private Implementation Boundary</text>
  <text x="334" y="658" class="small">Templates and worksheets stay public-safe; customer-specific templates, connector credentials, license validation, and Enterprise source stay private.</text>
</svg>
