<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA Go Reproducible Air-Gapped Build Flow</title>
  <desc id="desc">Release workflow creates signed Go runtime artifacts, verifies them before transfer, then re-verifies and optionally rebuilds inside a restricted environment.</desc>
  <defs>
    <style>
      .bg{fill:#071014}
      .panel{fill:#10191f;stroke:#6ee7c2;stroke-width:2}
      .zone{fill:#0b1318;stroke:#37505c;stroke-width:2}
      .text{fill:#ecfeff;font-family:Inter,Arial,sans-serif}
      .muted{fill:#a8c5cc;font-family:Inter,Arial,sans-serif}
      .accent{fill:#6ee7c2;font-family:Inter,Arial,sans-serif;font-weight:700}
      .warn{fill:#ffd166;font-family:Inter,Arial,sans-serif;font-weight:700}
      .arrow{stroke:#6ee7c2;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6ee7c2"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="520"/>
  <text class="accent" x="48" y="54" font-size="28">CAVRA Go Runtime: Reproducible Air-Gapped Release Flow</text>
  <text class="muted" x="48" y="84" font-size="15">Community source builds public-safe binaries; enterprise source, private keys, and customer data stay outside the public repository.</text>

  <rect class="zone" x="40" y="120" width="500" height="340" rx="8"/>
  <text class="accent" x="68" y="154" font-size="18">Connected Release Environment</text>
  <rect class="panel" x="72" y="188" width="180" height="92" rx="8"/>
  <text class="text" x="94" y="222" font-size="17">GitHub Actions</text>
  <text class="muted" x="94" y="250" font-size="13">Go build matrix</text>
  <text class="muted" x="94" y="270" font-size="13">CGO=0, trimpath</text>

  <rect class="panel" x="312" y="188" width="180" height="92" rx="8"/>
  <text class="text" x="334" y="222" font-size="17">Release Package</text>
  <text class="muted" x="334" y="250" font-size="13">Checksums, SBOM</text>
  <text class="muted" x="334" y="270" font-size="13">Signatures, provenance</text>

  <rect class="panel" x="192" y="332" width="220" height="82" rx="8"/>
  <text class="text" x="214" y="364" font-size="17">Reproducibility Manifest</text>
  <text class="muted" x="214" y="392" font-size="13">Targets, flags, hashes, rebuild commands</text>

  <path class="arrow" d="M252 234 H302"/>
  <path class="arrow" d="M402 280 V326"/>
  <path class="arrow" d="M252 280 L218 326"/>

  <rect class="zone" x="640" y="120" width="500" height="340" rx="8"/>
  <text class="accent" x="668" y="154" font-size="18">Restricted / Air-Gapped Environment</text>
  <rect class="panel" x="672" y="188" width="190" height="92" rx="8"/>
  <text class="text" x="694" y="222" font-size="17">Verify Bundle</text>
  <text class="muted" x="694" y="250" font-size="13">verify-airgap-bundle</text>
  <text class="muted" x="694" y="270" font-size="13">safe zip members</text>

  <rect class="panel" x="922" y="188" width="180" height="92" rx="8"/>
  <text class="text" x="944" y="222" font-size="17">Verify Package</text>
  <text class="muted" x="944" y="250" font-size="13">verify-go-package</text>
  <text class="muted" x="944" y="270" font-size="13">manifest required</text>

  <rect class="panel" x="792" y="332" width="200" height="82" rx="8"/>
  <text class="text" x="814" y="364" font-size="17">Optional Rebuild</text>
  <text class="muted" x="814" y="392" font-size="13">Compare SHA-256 before install</text>

  <path class="arrow" d="M862 234 H912"/>
  <path class="arrow" d="M1012 280 L942 326"/>
  <path class="arrow" d="M672 372 H424"/>
  <text class="warn" x="506" y="365" font-size="14">approved transfer</text>
  <path class="arrow" d="M540 238 H632"/>
</svg>
