<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA Go Rollback Drill Console Drill-Downs</title>
  <desc id="desc">Evidence Console flow for rollback drill notification history, acknowledgements, escalation routes, and exportable evidence.</desc>
  <defs>
    <style>
      .bg { fill: #101316; }
      .panel { fill: #151a1e; stroke: #2d3a40; stroke-width: 2; rx: 14; }
      .accent { fill: #76d6b2; }
      .warn { fill: #ffd479; }
      .danger { fill: #ff8f8f; }
      .text { fill: #eef3f6; font: 700 24px Inter, Arial, sans-serif; }
      .small { fill: #cbd5db; font: 500 16px Inter, Arial, sans-serif; }
      .tiny { fill: #aebbc3; font: 500 13px Inter, Arial, sans-serif; }
      .line { stroke: #76d6b2; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #3d4c54; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76d6b2"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="680"/>
  <text x="52" y="64" class="text">Go Rollback Drill Notification Drill-Downs</text>
  <text x="52" y="96" class="small">Evidence Console turns notification metadata into operator-ready acknowledgement and escalation review.</text>

  <rect x="52" y="142" width="245" height="132" class="panel"/>
  <text x="76" y="184" class="text">History API</text>
  <text x="76" y="216" class="small">plans, deliveries,</text>
  <text x="76" y="240" class="small">acks, escalations</text>
  <text x="76" y="262" class="tiny">GET /rollback-drill-notifications</text>

  <rect x="52" y="336" width="245" height="132" class="panel"/>
  <text x="76" y="378" class="text">Dashboard API</text>
  <text x="76" y="410" class="small">counts outstanding</text>
  <text x="76" y="434" class="small">and failed delivery</text>
  <text x="76" y="456" class="tiny">GET /dashboard</text>

  <rect x="412" y="142" width="328" height="326" class="panel"/>
  <text x="440" y="184" class="text">Evidence Console</text>
  <text x="440" y="220" class="small">Provider filter</text>
  <text x="440" y="252" class="small">State filter</text>
  <text x="440" y="284" class="small">Metadata kind filter</text>
  <line x1="440" y1="318" x2="704" y2="318" class="muted"/>
  <text x="440" y="358" class="accent small">Notification history rows</text>
  <text x="440" y="390" class="warn small">Escalation route rows</text>
  <text x="440" y="422" class="danger small">Breached SLO indicators</text>

  <rect x="864" y="132" width="250" height="118" class="panel"/>
  <text x="890" y="174" class="text">Details Panel</text>
  <text x="890" y="206" class="small">JSON route, plan,</text>
  <text x="890" y="230" class="small">ack, or delivery</text>

  <rect x="864" y="306" width="250" height="118" class="panel"/>
  <text x="890" y="348" class="text">Export</text>
  <text x="890" y="380" class="small">Reviewer-ready</text>
  <text x="890" y="404" class="small">metadata artifact</text>

  <rect x="864" y="482" width="250" height="118" class="panel"/>
  <text x="890" y="524" class="text">Operator Action</text>
  <text x="890" y="556" class="small">acknowledge, resolve,</text>
  <text x="890" y="580" class="small">or escalate owner</text>

  <path d="M 297 208 C 342 208 360 208 412 208" class="line"/>
  <path d="M 297 402 C 342 402 360 402 412 402" class="line"/>
  <path d="M 740 206 C 792 206 812 190 864 190" class="line"/>
  <path d="M 740 358 C 792 358 812 364 864 364" class="line"/>
  <path d="M 740 420 C 792 444 812 540 864 540" class="line"/>

  <rect x="52" y="544" width="688" height="82" class="panel"/>
  <text x="76" y="584" class="small">Public-safe boundary: no connector credentials, private URLs, license secrets, customer data, or Enterprise source.</text>
  <text x="76" y="610" class="tiny">Community dashboard can run against live API or bundled sample metadata.</text>
</svg>
