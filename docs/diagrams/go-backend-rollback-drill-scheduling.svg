<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA Go Backend Rollback Drill Scheduling</title>
  <desc id="desc">Rollback drill history feeds a recurring schedule check. Stale or due-soon drills produce notification plans and connector delivery evidence.</desc>
  <defs>
    <style>
      .bg{fill:#071014}
      .panel{fill:#101b21;stroke:#5ee0c2;stroke-width:2;rx:12}
      .panel2{fill:#13242b;stroke:#93b7c3;stroke-width:2;rx:12}
      .warn{fill:#2b2113;stroke:#f6c65b;stroke-width:2;rx:12}
      .text{fill:#eef7f6;font:600 22px Arial, sans-serif}
      .small{fill:#b8c9cf;font:16px Arial, sans-serif}
      .tiny{fill:#8fa5ad;font:14px Arial, sans-serif}
      .accent{fill:#6ee7c8;font:700 18px Arial, sans-serif}
      .arrow{stroke:#6ee7c8;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .muted{stroke:#51656d;stroke-width:3;fill:none;marker-end:url(#arrow-muted)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6ee7c8"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#51656d"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="56" y="60" class="text">CAVRA Rollback Drill Scheduling</text>
  <text x="56" y="90" class="small">Recurring evidence that promoted Go backend pilots can return to Python-only mode</text>

  <rect x="60" y="150" width="230" height="130" class="panel"/>
  <text x="88" y="190" class="accent">Drill History</text>
  <text x="88" y="222" class="small">latest passed drill</text>
  <text x="88" y="248" class="small">fallback verified</text>
  <text x="88" y="274" class="tiny">CAVRA_GO_ROLLBACK_DRILL_HISTORY</text>

  <rect x="360" y="150" width="250" height="130" class="panel"/>
  <text x="388" y="190" class="accent">Schedule Metadata</text>
  <text x="388" y="222" class="small">active cadence</text>
  <text x="388" y="248" class="small">owners and routes</text>
  <text x="388" y="274" class="tiny">CAVRA_GO_ROLLBACK_DRILL_SCHEDULE</text>

  <rect x="690" y="135" width="250" height="160" class="warn"/>
  <text x="718" y="178" class="accent">Schedule Evaluator</text>
  <text x="718" y="212" class="small">ready</text>
  <text x="718" y="238" class="small">due_soon</text>
  <text x="718" y="264" class="small">needs_attention</text>

  <rect x="710" y="380" width="250" height="130" class="panel2"/>
  <text x="738" y="420" class="accent">Production Readiness</text>
  <text x="738" y="452" class="small">blocks stale schedules</text>
  <text x="738" y="478" class="small">surfaces next due date</text>

  <rect x="990" y="150" width="150" height="130" class="panel"/>
  <text x="1018" y="190" class="accent">Connectors</text>
  <text x="1018" y="222" class="small">Slack</text>
  <text x="1018" y="248" class="small">Teams</text>
  <text x="1018" y="274" class="tiny">redacted evidence</text>

  <rect x="370" y="380" width="250" height="130" class="panel2"/>
  <text x="398" y="420" class="accent">Promoted Mode Gate</text>
  <text x="398" y="452" class="small">Go selected only when</text>
  <text x="398" y="478" class="small">schedule is ready or due soon</text>

  <path d="M290 215 H360" class="arrow"/>
  <path d="M610 215 H690" class="arrow"/>
  <path d="M940 215 H990" class="arrow"/>
  <path d="M815 295 V380" class="arrow"/>
  <path d="M690 445 H620" class="muted"/>
  <path d="M485 380 V280" class="muted"/>

  <text x="64" y="555" class="tiny">Public repository stores schemas, checks, and redacted delivery evidence. Connector credentials and private routing side effects stay outside public source.</text>
</svg>
