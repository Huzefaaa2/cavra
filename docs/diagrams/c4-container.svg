  <path class="arrow" d="M610 299 L712 241"/>
  <path class="arrow" d="M610 357 L712 241"/>
  <path class="arrow" d="M962 241 L1064 241"/>
  <path class="arrow" d="M1180 264 L1180 276"/>
  <path class="arrow" d="M1180 322 L1180 334"/>
  <path class="soft-arrow" d="M875 264 L875 480"/>
  <path class="soft-arrow" d="M962 357 L1042 507"/>
  <path class="arrow" d="M545 480 L545 380"/>

  <path class="arrow" d="M264 144 L360 241"/>
  <path class="arrow" d="M264 236 L360 357"/>
  <path class="arrow" d="M264 328 L1064 299"/>

  <rect x="54" y="770" width="1336" height="132" rx="10" class="boundary"/>
  <text x="78" y="800" class="boundary-title">Enterprise Integrations</text>

  <rect x="86" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="102" y="847" class="node-title">Git / PR Platforms</text>
  <text x="102" y="863" class="node-text">GitHub, GitLab, Azure DevOps</text>
  <rect x="302" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="318" y="847" class="node-title">SIEM / SOC</text>
  <text x="318" y="863" class="node-text">Splunk, Sentinel, Datadog</text>
  <rect x="518" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="534" y="847" class="node-title">Immutable Storage</text>
  <text x="534" y="863" class="node-text">S3 Object Lock, Azure blob</text>
  <rect x="734" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="750" y="847" class="node-title">ITSM / ChatOps</text>
  <text x="750" y="863" class="node-text">ServiceNow, Jira, Slack, Teams</text>
  <rect x="950" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="966" y="847" class="node-title">Enterprise Identity</text>
  <text x="966" y="863" class="node-text">OIDC, SAML, Entra, Okta</text>
  <rect x="1166" y="828" width="180" height="46" rx="7" class="external"/>
  <text x="1182" y="847" class="node-title">Cloud / Infra</text>
  <text x="1182" y="863" class="node-text">Terraform, Kubernetes, cloud CLI</text>

  <path class="soft-arrow" d="M1180 380 C1180 675 176 675 176 828"/>
  <path class="soft-arrow" d="M1180 380 C1180 680 392 680 392 828"/>
  <path class="soft-arrow" d="M1180 380 C1180 684 608 684 608 828"/>
  <path class="soft-arrow" d="M837 380 C837 680 824 680 824 828"/>
  <path class="soft-arrow" d="M855 380 C855 704 1040 704 1040 828"/>
  <path class="soft-arrow" d="M485 380 C485 708 1040 708 1040 828"/>
  <path class="soft-arrow" d="M837 264 C837 700 1256 700 1256 828"/>

  <rect x="1040" y="596" width="282" height="86" rx="8" class="legend"/>
  <text x="1060" y="622" class="node-title">Reading guide</text>
  <text x="1060" y="642" class="small">Runtime Guard is the decision boundary.</text>
  <text x="1060" y="658" class="small">Evidence Hub records what happened.</text>
  <text x="1060" y="674" class="small">Approval routing uses policy and identity.</text>
</svg>
