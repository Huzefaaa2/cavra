<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA C4 Container View</title>
  <desc id="desc">A C4 container diagram showing CAVRA interaction surfaces, runtime authority, evidence plane, planned enforcement plane, and enterprise integrations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344955"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #14212b; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5f6f; }
      .boundary { fill: #ffffff; stroke: #c7d3dc; stroke-width: 1.5; }
      .boundary-title { font: 700 16px Arial, sans-serif; fill: #253642; }
      .actor { fill: #eef6ff; stroke: #3b6f8f; stroke-width: 1.5; }
      .surface { fill: #eef6ff; stroke: #3b6f8f; stroke-width: 1.4; }
      .authority { fill: #f3fbef; stroke: #4d8b55; stroke-width: 1.4; }
      .evidence { fill: #fff4e5; stroke: #bd7a22; stroke-width: 1.4; }
      .external { fill: #f2f0fa; stroke: #7256b8; stroke-width: 1.4; }
      .planned { fill: #f6f8fa; stroke: #7d8b95; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .store { fill: #fff8d7; stroke: #9b7d0a; stroke-width: 1.4; }
      .node-title { font: 700 13px Arial, sans-serif; fill: #17242d; }
      .node-text { font: 400 11px Arial, sans-serif; fill: #435464; }
      .small { font: 400 10px Arial, sans-serif; fill: #526777; }
      .arrow { stroke: #344955; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #7a8d9a; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .legend { fill: #ffffff; stroke: #d5dfe6; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="980"/>
  <text x="54" y="54" class="title">CAVRA C4 Container View</text>
  <text x="54" y="80" class="subtitle">Runtime authority, evidence, metadata, and enterprise integrations for governed AI-agent engineering.</text>

  <rect x="54" y="108" width="210" height="72" rx="8" class="actor"/>
  <text x="78" y="136" class="node-title">Developer</text>
  <text x="78" y="156" class="node-text">Uses AI coding tools</text>
  <text x="78" y="171" class="node-text">under CAVRA governance</text>

  <rect x="54" y="200" width="210" height="72" rx="8" class="actor"/>
  <text x="78" y="228" class="node-title">Platform / Security</text>
  <text x="78" y="248" class="node-text">Authors policies and</text>
  <text x="78" y="263" class="node-text">operates integrations</text>

  <rect x="54" y="292" width="210" height="72" rx="8" class="actor"/>
  <text x="78" y="320" class="node-title">Auditor / Reviewer</text>
  <text x="78" y="340" class="node-text">Reviews attestations,</text>
  <text x="78" y="355" class="node-text">metadata, and retention</text>

  <rect x="310" y="110" width="1040" height="610" rx="10" class="boundary"/>
  <text x="334" y="140" class="boundary-title">CAVRA</text>

  <rect x="338" y="164" width="300" height="246" rx="10" class="boundary"/>
  <text x="360" y="192" class="boundary-title">Interaction and Management</text>
  <rect x="360" y="218" width="250" height="46" rx="7" class="surface"/>
  <text x="376" y="237" class="node-title">CAVRA CLI</text>
  <text x="376" y="253" class="node-text">Evaluate, sign, export, index</text>
  <rect x="360" y="276" width="250" height="46" rx="7" class="surface"/>
  <text x="376" y="295" class="node-title">CAVRA MCP Server</text>
  <text x="376" y="311" class="node-text">Governed tool interface</text>
  <rect x="360" y="334" width="250" height="46" rx="7" class="surface"/>
  <text x="376" y="353" class="node-title">CAVRA API</text>
  <text x="376" y="369" class="node-text">Management and metadata API</text>

  <rect x="690" y="164" width="300" height="246" rx="10" class="boundary"/>
  <text x="712" y="192" class="boundary-title">Runtime Authority</text>
  <rect x="712" y="218" width="250" height="46" rx="7" class="authority"/>
  <text x="728" y="237" class="node-title">Runtime Guard</text>
  <text x="728" y="253" class="node-text">Pre-action decisions</text>
  <rect x="712" y="276" width="250" height="46" rx="7" class="authority"/>
  <text x="728" y="295" class="node-title">Policy Registry</text>
  <text x="728" y="311" class="node-text">Validation, inheritance, diff</text>
  <rect x="712" y="334" width="250" height="46" rx="7" class="authority"/>
  <text x="728" y="353" class="node-title">Approval Router</text>
  <text x="728" y="369" class="node-text">OIDC, RBAC, approval console</text>

  <rect x="1042" y="164" width="280" height="246" rx="10" class="boundary"/>
  <text x="1064" y="192" class="boundary-title">Evidence and Audit Plane</text>
  <rect x="1064" y="218" width="230" height="46" rx="7" class="evidence"/>
  <text x="1080" y="237" class="node-title">Evidence Hub</text>
  <text x="1080" y="253" class="node-text">Bundles, signatures, exports</text>
  <rect x="1064" y="276" width="230" height="46" rx="7" class="store"/>
  <text x="1080" y="295" class="node-title">Metadata Store</text>
  <text x="1080" y="311" class="node-text">JSON and SQLite search</text>
  <rect x="1064" y="334" width="230" height="46" rx="7" class="store"/>
  <text x="1080" y="353" class="node-title">Bundle Store</text>
  <text x="1080" y="369" class="node-text">Filesystem and immutable plans</text>

  <rect x="420" y="480" width="250" height="54" rx="8" class="surface"/>
  <text x="442" y="502" class="node-title">Before the Agent Acts Sandbox</text>
  <text x="442" y="520" class="node-text">Interactive demo and API consumer</text>

  <rect x="750" y="480" width="250" height="54" rx="8" class="planned"/>
  <text x="772" y="502" class="node-title">Go Enforcement Plane</text>
  <text x="772" y="520" class="node-text">Planned local and CI enforcement</text>

  <rect x="1042" y="480" width="250" height="54" rx="8" class="authority"/>
  <text x="1064" y="502" class="node-title">Agent and MCP Trust Registry</text>
  <text x="1064" y="520" class="node-text">JSON/SQLite trust decisions</text>

