<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="CAVRA Policy Lifecycle">
  <rect width="1400" height="760" fill="#101316"/>
  <text x="70" y="70" fill="#eef3f6" font-family="Arial" font-size="36" font-weight="700">CAVRA Policy Lifecycle</text>
  <text x="70" y="108" fill="#76d6b2" font-family="Arial" font-size="19">Author, validate, inherit, sign, enforce, and audit.</text>
  <g fill="#151a1e" stroke="#76d6b2" stroke-width="2">
    <rect x="70" y="260" width="170" height="110" rx="10"/>
    <rect x="285" y="260" width="170" height="110" rx="10"/>
    <rect x="500" y="260" width="170" height="110" rx="10"/>
    <rect x="715" y="260" width="170" height="110" rx="10"/>
    <rect x="930" y="260" width="170" height="110" rx="10"/>
    <rect x="1145" y="260" width="170" height="110" rx="10"/>
  </g>
  <g fill="#eef3f6" font-family="Arial" font-size="18" font-weight="700">
    <text x="155" y="304" text-anchor="middle">Author</text>
    <text x="155" y="334" text-anchor="middle">policy.yaml</text>
    <text x="370" y="304" text-anchor="middle">Validate</text>
    <text x="370" y="334" text-anchor="middle">JSON Schema</text>
    <text x="585" y="304" text-anchor="middle">Inherit</text>
    <text x="585" y="334" text-anchor="middle">overrides</text>
    <text x="800" y="304" text-anchor="middle">Sign</text>
    <text x="800" y="334" text-anchor="middle">metadata</text>
    <text x="1015" y="304" text-anchor="middle">Enforce</text>
    <text x="1015" y="334" text-anchor="middle">runtime</text>
    <text x="1230" y="304" text-anchor="middle">Audit</text>
    <text x="1230" y="334" text-anchor="middle">evidence</text>
  </g>
  <g stroke="#76d6b2" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#76d6b2"/></marker></defs>
    <path d="M240 315 L285 315"/>
    <path d="M455 315 L500 315"/>
    <path d="M670 315 L715 315"/>
    <path d="M885 315 L930 315"/>
    <path d="M1100 315 L1145 315"/>
  </g>
  <text x="700" y="510" text-anchor="middle" fill="#c8d2d8" font-family="Arial" font-size="20">Policy hardening prevents drift before enforcement reaches regulated repositories.</text>
</svg>
