<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA rollback drill closure packet verification and auditor export</title>
  <desc id="desc">Public-safe flow from release record attachment through closure packet verification and auditor export, with private delivery systems kept outside Community Edition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071316"/>
      <stop offset="1" stop-color="#14252c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#73e1c0"/>
      <stop offset="1" stop-color="#49a6d8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#73e1c0"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#f2fbff}
      .label{font:700 22px Arial,sans-serif;fill:#f2fbff}
      .small{font:500 16px Arial,sans-serif;fill:#c8d7dd}
      .tiny{font:500 14px Arial,sans-serif;fill:#9fb2bb}
      .box{fill:#112027;stroke:#35515c;stroke-width:2;rx:14}
      .guard{fill:#173127;stroke:#73e1c0;stroke-width:2;rx:14}
      .private{fill:#281b1b;stroke:#d8995b;stroke-width:2;rx:14}
      .accent{stroke:url(#accent);stroke-width:4}
      .line{stroke:#73e1c0;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .mutedLine{stroke:#6b7f88;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1320" height="760" fill="url(#bg)"/>
  <text x="70" y="76" class="title">CAVRA Final Reporting Closure Packet</text>
  <text x="70" y="108" class="small">Verification and auditor export for release records without public enterprise connector code</text>

  <rect x="70" y="165" width="230" height="140" class="box accent"/>
  <text x="94" y="210" class="label">Release Record</text>
  <text x="94" y="242" class="small">Attachment evidence</text>
  <text x="94" y="268" class="tiny">readiness, approval, runbook</text>

  <rect x="365" y="165" width="230" height="140" class="guard"/>
  <text x="389" y="210" class="label">Packet Verify</text>
  <text x="389" y="242" class="small">Completeness checks</text>
  <text x="389" y="268" class="tiny">pass, warning, fail</text>

  <rect x="660" y="165" width="230" height="140" class="guard"/>
  <text x="684" y="210" class="label">Auditor Export</text>
  <text x="684" y="242" class="small">Markdown and JSON</text>
  <text x="684" y="268" class="tiny">public-safe evidence index</text>

  <rect x="955" y="165" width="230" height="140" class="private"/>
  <text x="979" y="210" class="label">Private Delivery</text>
  <text x="979" y="242" class="small">GRC, SIEM, archive</text>
  <text x="979" y="268" class="tiny">future enterprise connectors</text>

  <path d="M300 235 H355" class="line"/>
  <path d="M595 235 H650" class="line"/>
  <path d="M890 235 H945" class="mutedLine"/>

  <rect x="110" y="405" width="300" height="175" class="box"/>
  <text x="138" y="448" class="label">Required Evidence</text>
  <text x="138" y="484" class="small">Readiness summary</text>
  <text x="138" y="512" class="small">Approved decision</text>
  <text x="138" y="540" class="small">Operator runbook export</text>
  <text x="138" y="568" class="small">Final closure dashboard</text>

  <rect x="510" y="405" width="300" height="175" class="guard"/>
  <text x="538" y="448" class="label">Community Boundary</text>
  <text x="538" y="484" class="small">Metadata references only</text>
  <text x="538" y="512" class="small">No customer payloads</text>
  <text x="538" y="540" class="small">No connector secrets</text>
  <text x="538" y="568" class="small">No enterprise source</text>

  <rect x="910" y="405" width="300" height="175" class="private"/>
  <text x="938" y="448" class="label">Enterprise Extension</text>
  <text x="938" y="484" class="small">Route export to systems</text>
  <text x="938" y="512" class="small">Store immutable archive refs</text>
  <text x="938" y="540" class="small">Attach to GRC records</text>
  <text x="938" y="568" class="small">Keep private implementation</text>

  <path d="M260 305 C260 350 260 360 260 395" class="line"/>
  <path d="M660 305 C660 350 660 360 660 395" class="line"/>
  <path d="M1060 305 C1060 350 1060 360 1060 395" class="mutedLine"/>

  <text x="275" y="690" class="small">Result: a release-ready auditor packet that can be reviewed publicly and routed privately.</text>
</svg>
