<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA auditor export retry and archive health</title>
  <desc id="desc">Flow from auditor export delivery metadata to retry planning, archive references, archive health, dashboard drill-downs, and private execution boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07191a"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#74e0c0"/>
      <stop offset="1" stop-color="#4bb3d3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#74e0c0"/>
    </marker>
  </defs>
  <rect width="1320" height="760" fill="url(#bg)"/>
  <text x="60" y="72" fill="#eaf7f5" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">CAVRA Auditor Export Retry and Archive Health</text>
  <text x="60" y="108" fill="#9fb7b8" font-family="Inter,Arial,sans-serif" font-size="18">Failed auditor deliveries become retry decisions, and verified exports are checked for archive custody gaps.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="170" width="230" height="120" rx="8" fill="#122024" stroke="#35515a"/>
    <text x="88" y="212" fill="#74e0c0" font-size="18" font-weight="700">Delivery Metadata</text>
    <text x="88" y="244" fill="#c9d7d8" font-size="14">Redacted connector success</text>
    <text x="88" y="266" fill="#c9d7d8" font-size="14">and failure evidence</text>

    <rect x="370" y="110" width="245" height="120" rx="8" fill="#122024" stroke="#35515a"/>
    <text x="398" y="152" fill="#74e0c0" font-size="18" font-weight="700">Retry Plan</text>
    <text x="398" y="184" fill="#c9d7d8" font-size="14">Retry, wait, or suppress</text>
    <text x="398" y="206" fill="#c9d7d8" font-size="14">failed auditor deliveries</text>

    <rect x="370" y="306" width="245" height="120" rx="8" fill="#122024" stroke="#35515a"/>
    <text x="398" y="348" fill="#74e0c0" font-size="18" font-weight="700">Archive Health</text>
    <text x="398" y="380" fill="#c9d7d8" font-size="14">Missing archive refs, hashes,</text>
    <text x="398" y="402" fill="#c9d7d8" font-size="14">or retention evidence</text>

    <rect x="700" y="170" width="250" height="120" rx="8" fill="#122024" stroke="#35515a"/>
    <text x="728" y="212" fill="#74e0c0" font-size="18" font-weight="700">Evidence Console</text>
    <text x="728" y="244" fill="#c9d7d8" font-size="14">Plan Auditor Retry, Archive</text>
    <text x="728" y="266" fill="#c9d7d8" font-size="14">Health, filter, details</text>

    <rect x="1030" y="170" width="230" height="120" rx="8" fill="#122024" stroke="#35515a"/>
    <text x="1058" y="212" fill="#74e0c0" font-size="18" font-weight="700">Private Boundary</text>
    <text x="1058" y="244" fill="#c9d7d8" font-size="14">Enterprise redelivery and</text>
    <text x="1058" y="266" fill="#c9d7d8" font-size="14">archive writes happen outside</text>
  </g>

  <g stroke="#74e0c0" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M290 230 C330 230 330 170 370 170"/>
    <path d="M290 230 C330 230 330 366 370 366"/>
    <path d="M615 170 C655 170 660 230 700 230"/>
    <path d="M615 366 C660 366 655 250 700 250"/>
    <path d="M950 230 H1030"/>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="175" y="530" width="970" height="104" rx="8" fill="#0e1518" stroke="#29424a"/>
    <text x="215" y="572" fill="#eaf7f5" font-size="20" font-weight="700">Community Edition evidence only</text>
    <text x="215" y="604" fill="#c9d7d8" font-size="15">Retry plans and archive health reports are public-safe metadata. No connector tokens, storage credentials, private endpoints, or customer payloads are stored.</text>
    <line x1="175" y1="506" x2="1145" y2="506" stroke="url(#accent)" stroke-width="4"/>
  </g>
</svg>
