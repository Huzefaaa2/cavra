<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CAVRA executive health alert retry and final closure flow</title>
  <desc id="desc">Public-safe flow for failed executive retry health alert delivery, retry planning, worker execution, evidence records, and final reporting closure.</desc>
  <defs>
    <style>
      .bg { fill: #071012; }
      .band { fill: #0d191c; stroke: #24464c; stroke-width: 2; }
      .box { fill: #102126; stroke: #69d6bd; stroke-width: 2; rx: 10; }
      .warn { fill: #241d10; stroke: #f7c85f; stroke-width: 2; rx: 10; }
      .crit { fill: #261316; stroke: #ff7d7d; stroke-width: 2; rx: 10; }
      .store { fill: #101820; stroke: #9fb7c0; stroke-width: 2; rx: 10; }
      .text { fill: #eef7f7; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #c7d5d8; font-family: Inter, Arial, sans-serif; font-size: 16px; }
      .label { fill: #69d6bd; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .arrow { stroke: #69d6bd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9fb7c0; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#69d6bd" />
    </marker>
  </defs>
  <rect class="bg" width="1280" height="720" />
  <text x="60" y="58" class="text">CAVRA Executive Health Alert Retry And Final Closure</text>
  <text x="60" y="88" class="small">Controlled Agentic Verification &amp; Runtime Authority</text>

  <rect x="40" y="120" width="360" height="520" class="band" rx="16" />
  <text x="70" y="160" class="label">Executive Alert Delivery</text>
  <rect x="75" y="195" width="290" height="90" class="box" />
  <text x="105" y="230" class="text">Retry Health</text>
  <text x="105" y="258" class="small">health report and alert plan</text>
  <rect x="75" y="330" width="290" height="90" class="crit" />
  <text x="105" y="365" class="text">Failed Delivery</text>
  <text x="105" y="393" class="small">redacted connector metadata</text>
  <rect x="75" y="465" width="290" height="90" class="store" />
  <text x="105" y="500" class="text">Evidence Store</text>
  <text x="105" y="528" class="small">public-safe delivery records</text>

  <rect x="460" y="120" width="360" height="520" class="band" rx="16" />
  <text x="490" y="160" class="label">Retry Automation</text>
  <rect x="495" y="195" width="290" height="90" class="warn" />
  <text x="525" y="230" class="text">Retry Plan</text>
  <text x="525" y="258" class="small">retry, wait, or suppress</text>
  <rect x="495" y="330" width="290" height="90" class="box" />
  <text x="525" y="365" class="text">Retry Worker</text>
  <text x="525" y="393" class="small">dry-run default, live on execute</text>
  <rect x="495" y="465" width="290" height="90" class="store" />
  <text x="525" y="500" class="text">Execution Record</text>
  <text x="525" y="528" class="small">hash-bound retry evidence</text>

  <rect x="880" y="120" width="360" height="520" class="band" rx="16" />
  <text x="910" y="160" class="label">Closure Governance</text>
  <rect x="915" y="195" width="290" height="90" class="box" />
  <text x="945" y="230" class="text">Dashboard Counts</text>
  <text x="945" y="258" class="small">retryable, worker, failed execution</text>
  <rect x="915" y="330" width="290" height="90" class="warn" />
  <text x="945" y="365" class="text">Closure State</text>
  <text x="945" y="393" class="small">open until gaps are resolved</text>
  <rect x="915" y="465" width="290" height="90" class="box" />
  <text x="945" y="500" class="text">Operator Actions</text>
  <text x="945" y="528" class="small">retry, acknowledge, review</text>

  <path class="arrow" d="M220 285 L220 330" />
  <path class="arrow" d="M220 420 L220 465" />
  <path class="arrow" d="M365 375 C420 375 430 240 495 240" />
  <path class="arrow" d="M640 285 L640 330" />
  <path class="arrow" d="M640 420 L640 465" />
  <path class="arrow" d="M785 510 C850 510 850 240 915 240" />
  <path class="arrow" d="M1060 285 L1060 330" />
  <path class="arrow" d="M1060 420 L1060 465" />
  <path class="dash" d="M915 510 C830 625 410 625 220 555" />

  <text x="60" y="675" class="small">Boundary: public Community Edition stores interfaces, redacted evidence, and dashboards only. Connector secrets and enterprise code stay outside this repository.</text>
</svg>
