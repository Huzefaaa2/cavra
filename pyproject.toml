[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavra"
version = "1.0.0rc1"
description = "AI agent runtime governance for regulated engineering."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Huzefa Husain" }]
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "governance", "runtime", "policy", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.8",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
  "httpx>=0.27",
  "black>=23.0",
  "mypy>=1.0",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/Huzefaaa2/cavra/issues"
"Documentation" = "https://github.com/Huzefaaa2/cavra/tree/main/docs"
"Source Code" = "https://github.com/Huzefaaa2/cavra"

[project.scripts]
cavra = "cavra.cli:main"
cavra-mcp-server = "cavra.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
cavra = ["py.typed", "schemas/*.json"]
"cavra.schemas" = ["*.json"]
