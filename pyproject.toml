[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavra"
version = "0.1.0"
description = "AI agent runtime governance for regulated engineering."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Huzefa Husain" }]
license = { text = "BUSL-1.1" }
keywords = ["ai", "governance", "runtime", "policy", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.8",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[project.scripts]
cavra = "cavra.cli:main"
cavra-mcp-server = "cavra.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
