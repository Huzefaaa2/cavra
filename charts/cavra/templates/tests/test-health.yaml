apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cavra.fullname" . }}-test-health"
  labels:
    {{- include "cavra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - curl -fsS "http://{{ include "cavra.fullname" . }}:{{ .Values.service.port }}/health"
