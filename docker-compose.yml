services:
  cavra-api:
    build: .
    command: ["uvicorn", "cavra.api:app", "--host", "0.0.0.0", "--port", "8000"]
    entrypoint: []
    ports:
      - "8000:8000"
  sandbox-ui:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["python", "-m", "http.server", "5173", "--directory", "apps/sandbox-ui"]
    ports:
      - "5173:5173"
