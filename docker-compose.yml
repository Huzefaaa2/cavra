services:
  cavra-api:
    build: .
    command: ["uvicorn", "cavra.api:app", "--host", "0.0.0.0", "--port", "8000"]
    entrypoint: []
    environment:
      CAVRA_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174"
      CAVRA_DEPLOYMENT_ENVIRONMENT: "local"
      CAVRA_DEPLOYMENT_PLATFORM: "docker"
      CAVRA_DEPLOYMENT_RUNTIME: "container"
      CAVRA_INSTALL_TARGET: "community"
      CAVRA_ORCHESTRATOR: "docker_desktop"
      CAVRA_ADMIN_ENABLED: "true"
      CAVRA_ADMIN_DEFAULT_ACTOR: "local-admin"
    ports:
      - "8000:8000"
  sandbox-ui:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./docker/sandbox-ui.config.local.js:/app/apps/sandbox-ui/config.js:ro
    command: ["python", "-m", "http.server", "5173", "--directory", "apps/sandbox-ui"]
    ports:
      - "5173:5173"
  admin-console:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./docker/admin-console.config.local.js:/app/apps/admin-console/config.js:ro
    command: ["python", "-m", "http.server", "5174", "--directory", "apps/admin-console"]
    ports:
      - "5174:5174"
