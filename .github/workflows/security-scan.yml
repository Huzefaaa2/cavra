name: Community Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate-release-packets.py
      - run: python scripts/validate-maintenance-release-evidence.py
      - run: python scripts/validate-community-release-note-freshness.py
      - run: python scripts/validate-community-release-index.py
      - run: python scripts/validate-community-release-readiness-dashboard.py
      - run: python scripts/validate-sandbox-portal.py
      - run: python scripts/validate-console-closeout.py
      - run: python scripts/validate-community-ga-path.py
      - run: python scripts/validate-production-deployment-guide.py
      - run: python scripts/validate-go-production-hardening.py
      - run: python scripts/validate-enterprise-integration-readiness.py
      - run: python scripts/validate-production-readiness-procurement-closeout.py
      - run: python scripts/validate-community-v100-stabilization.py
      - run: bash scripts/validate-boundaries.sh .
      - run: python -m compileall src
