name: Customer Lifecycle Phase 8 Customer Health Review

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-customer-health-review.yml"
      - "examples/customer-lifecycle-phase8-customer-health-review/**"
      - "scripts/validate_customer_lifecycle_phase8_customer_health_review.py"
      - "src/cavra/customer_lifecycle_phase8_customer_health_review.py"
      - "tests/test_customer_lifecycle_phase8_customer_health_review.py"
      - "src/cavra/cli.py"
  push:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-customer-health-review.yml"
      - "examples/customer-lifecycle-phase8-customer-health-review/**"
      - "scripts/validate_customer_lifecycle_phase8_customer_health_review.py"
      - "src/cavra/customer_lifecycle_phase8_customer_health_review.py"
      - "tests/test_customer_lifecycle_phase8_customer_health_review.py"
      - "src/cavra/cli.py"
  workflow_dispatch:

jobs:
  validate-phase8-customer-health-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Phase 8 customer health review packet
        run: python scripts/validate_customer_lifecycle_phase8_customer_health_review.py --packet examples/customer-lifecycle-phase8-customer-health-review/customer-lifecycle-phase8-customer-health-review.sample.json --repo-root .
      - name: Validate live sanitized Phase 8 customer health review packet
        run: python scripts/validate_customer_lifecycle_phase8_customer_health_review.py --packet examples/customer-lifecycle-phase8-customer-health-review/customer-lifecycle-phase8-customer-health-review.live.sanitized.example.json --repo-root . --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_customer_lifecycle_phase8_customer_health_review.py tests/test_customer_lifecycle_phase8_telemetry_depth.py tests/test_customer_lifecycle_phase8_support_automation.py tests/test_customer_lifecycle_phase8_lifecycle_analytics.py -q
      - name: Lint Phase 8 customer health review surfaces
        run: python -m ruff check src/cavra/customer_lifecycle_phase8_customer_health_review.py scripts/validate_customer_lifecycle_phase8_customer_health_review.py tests/test_customer_lifecycle_phase8_customer_health_review.py src/cavra/cli.py
