name: AI Agent Governance Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cavra:
    name: cavra-required-check
    runs-on: ubuntu-latest
    env:
      CAVRA_EVIDENCE_SIGNING_KEY: ${{ secrets.CAVRA_EVIDENCE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/cavra-runtime/go.mod
      - name: Install CAVRA
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate policy packs
        run: |
          for policy in policies/*/policy.yaml; do
            cavra policy validate "$policy"
          done
      - name: Run required governance checks
        run: |
          cavra policy list
          ruff check src/ tests/
          (cd go/cavra-runtime && go test ./...)
          pytest -q
          python scripts/validate-release-packets.py
      - name: Generate required-check evidence
        env:
          FALLBACK_EVIDENCE_KEY: cavra-required-check-demo-key
        run: |
          set -euo pipefail
          evidence_key="${CAVRA_EVIDENCE_SIGNING_KEY:-$FALLBACK_EVIDENCE_KEY}"
          rm -rf .cavra/evidence/required-check .cavra/evidence/attestation
          cavra evidence bundle \
            --output .cavra/evidence/required-check \
            --signer "github-actions:${GITHUB_WORKFLOW}" \
            --key "$evidence_key"
          cavra evidence verify .cavra/evidence/required-check --key "$evidence_key"
          cavra evidence verify-attestation \
            .cavra/evidence/required-check \
            --output .cavra/evidence/attestation
      - name: Publish governance summary
        if: always()
        run: |
          {
            echo "## CAVRA required check"
            echo ""
            echo "- Policy packs validated."
            echo "- Runtime tests and lint completed."
            echo "- Go enforcement-plane parity scaffold tested."
            echo "- Evidence bundle generated and verified."
            echo "- PR attestation verified against evidence."
            echo ""
            echo "Required check name: \`cavra-required-check\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload required-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cavra-required-check-evidence
          path: |
            .cavra/evidence/required-check/
            .cavra/evidence/attestation/
          if-no-files-found: warn
