name: AI Agent Governance Check

on: [pull_request]

jobs:
  cavra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install CAVRA
        run: |
          pip install -e .
      - name: Run AI governance checks
        run: |
          cavra policy list
      - name: Generate attestation artifact
        run: |
          mkdir -p .cavra/artifacts
          echo "AI governance checks passed" > .cavra/artifacts/cavra-report.txt
      - name: Upload attestation
        uses: actions/upload-artifact@v3
        with:
          name: cavra-attestation
          path: .cavra/artifacts/
