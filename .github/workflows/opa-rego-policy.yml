name: OPA Rego Policy Path

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the OPA/Rego policy readiness packet JSON."
        required: false
        default: "examples/opa-rego/enterprise-opa-rego-policy.sample.json"
      require_live:
        description: "Require evidence_mode=live and fail on sample packets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "src/cavra/opa_rego_policy.py"
      - "src/cavra/cli.py"
      - "scripts/validate_opa_rego_policy.py"
      - "examples/opa-rego/**"
      - "tests/test_opa_rego_policy.py"
      - ".github/workflows/opa-rego-policy.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/opa_rego_policy.py"
      - "src/cavra/cli.py"
      - "scripts/validate_opa_rego_policy.py"
      - "examples/opa-rego/**"
      - "tests/test_opa_rego_policy.py"
      - ".github/workflows/opa-rego-policy.yml"

permissions:
  contents: read

jobs:
  opa-rego-policy-contract:
    name: Validate OPA/Rego policy path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Export Rego compatibility bundle
        run: |
          python scripts/validate_opa_rego_policy.py \
            --policy-pack cavra-ai-agent-baseline \
            --export-dir dist/opa-rego \
            --output dist/opa-rego-export.json
      - name: Run Rego/Python parity
        run: |
          python scripts/validate_opa_rego_policy.py \
            --policy-pack cavra-ai-agent-baseline \
            --parity \
            --output dist/opa-rego-parity.json
      - name: Evaluate sample OPA input
        run: |
          python scripts/validate_opa_rego_policy.py \
            --policy-pack cavra-ai-agent-baseline \
            --input examples/opa-rego/input.block-env-read.json \
            --output dist/opa-rego-input-evaluation.json
      - name: Validate sample packet
        run: |
          python scripts/validate_opa_rego_policy.py \
            --packet examples/opa-rego/enterprise-opa-rego-policy.sample.json \
            --output dist/enterprise-opa-rego-policy-sample.json
      - name: Validate sanitized live packet
        run: |
          python scripts/validate_opa_rego_policy.py \
            --packet examples/opa-rego/enterprise-opa-rego-policy.live.sanitized.example.json \
            --require-live \
            --output dist/enterprise-opa-rego-policy-live-sanitized.json
      - name: Test OPA/Rego policy path
        run: python -m pytest tests/test_opa_rego_policy.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: opa-rego-policy
          path: |
            dist/opa-rego-export.json
            dist/opa-rego-parity.json
            dist/enterprise-opa-rego-policy-sample.json
            dist/enterprise-opa-rego-policy-live-sanitized.json
            dist/opa-rego/

  opa-rego-policy-live:
    name: Validate selected live OPA/Rego policy packet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate selected packet
        run: |
          REQUIRE_LIVE=""
          if [ "${{ inputs.require_live }}" = "true" ]; then
            REQUIRE_LIVE="--require-live"
          fi
          python scripts/validate_opa_rego_policy.py \
            --packet "${{ inputs.packet_path }}" \
            $REQUIRE_LIVE \
            --output dist/enterprise-opa-rego-policy-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: opa-rego-policy-live
          path: dist/enterprise-opa-rego-policy-live.json
