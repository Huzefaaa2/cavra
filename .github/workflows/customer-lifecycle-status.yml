name: Customer Lifecycle Public Status

on:
  push:
    paths:
      - "src/cavra/customer_lifecycle_status.py"
      - "scripts/validate_customer_lifecycle_status.py"
      - "examples/customer-lifecycle-status/**"
      - "tests/test_customer_lifecycle_status.py"
      - ".github/workflows/customer-lifecycle-status.yml"
  pull_request:
    paths:
      - "src/cavra/customer_lifecycle_status.py"
      - "scripts/validate_customer_lifecycle_status.py"
      - "examples/customer-lifecycle-status/**"
      - "tests/test_customer_lifecycle_status.py"
      - ".github/workflows/customer-lifecycle-status.yml"

jobs:
  validate-customer-lifecycle-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e . pytest ruff
      - name: Validate sample public status
        run: python scripts/validate_customer_lifecycle_status.py --packet examples/customer-lifecycle-status/customer-lifecycle-status.sample.json
      - name: Validate live sanitized public status
        run: python scripts/validate_customer_lifecycle_status.py --packet examples/customer-lifecycle-status/customer-lifecycle-status.live.sanitized.example.json --require-live
      - name: Run tests
        run: python -m pytest tests/test_customer_lifecycle_status.py -q
      - name: Lint
        run: python -m ruff check src/cavra/customer_lifecycle_status.py scripts/validate_customer_lifecycle_status.py tests/test_customer_lifecycle_status.py
