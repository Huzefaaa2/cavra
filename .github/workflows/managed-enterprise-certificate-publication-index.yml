name: Managed Enterprise Certificate Publication Index

on:
  pull_request:
    paths:
      - ".github/workflows/managed-enterprise-certificate-publication-index.yml"
      - "README.md"
      - "docs/managed-enterprise-certificate-publication-index.md"
      - "docs/wiki/Managed-Enterprise-Certificate-Publication-Index.md"
      - "examples/managed-enterprise-certificate-publication/**"
      - "scripts/validate_managed_enterprise_certificate_publication_index.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_certificate_publication_index.py"
      - "tests/test_managed_enterprise_certificate_publication_index.py"
  push:
    paths:
      - ".github/workflows/managed-enterprise-certificate-publication-index.yml"
      - "README.md"
      - "docs/managed-enterprise-certificate-publication-index.md"
      - "docs/wiki/Managed-Enterprise-Certificate-Publication-Index.md"
      - "examples/managed-enterprise-certificate-publication/**"
      - "scripts/validate_managed_enterprise_certificate_publication_index.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_certificate_publication_index.py"
      - "tests/test_managed_enterprise_certificate_publication_index.py"
  workflow_dispatch:

jobs:
  validate-managed-enterprise-certificate-publication-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Managed/Enterprise certificate publication index
        run: python scripts/validate_managed_enterprise_certificate_publication_index.py --index examples/managed-enterprise-certificate-publication/managed-enterprise-certificate-publication-index.sample.json
      - name: Validate live sanitized Managed/Enterprise certificate publication index
        run: python scripts/validate_managed_enterprise_certificate_publication_index.py --index examples/managed-enterprise-certificate-publication/managed-enterprise-certificate-publication-index.live.sanitized.example.json --require-live
      - name: Validate live sanitized certificate publication index through CAVRA CLI
        run: python -m cavra.cli release managed-enterprise-certificate-publication-index --index examples/managed-enterprise-certificate-publication/managed-enterprise-certificate-publication-index.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_managed_enterprise_certificate_publication_index.py -q
      - name: Lint Managed/Enterprise certificate publication index surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/managed_enterprise_certificate_publication_index.py scripts/validate_managed_enterprise_certificate_publication_index.py tests/test_managed_enterprise_certificate_publication_index.py
