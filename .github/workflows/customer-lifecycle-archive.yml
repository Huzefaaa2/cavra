name: Customer Lifecycle Archive Manifest

on:
  push:
    paths:
      - "src/cavra/customer_lifecycle_archive.py"
      - "scripts/validate_customer_lifecycle_archive.py"
      - "examples/customer-lifecycle-archive/**"
      - "tests/test_customer_lifecycle_archive.py"
      - ".github/workflows/customer-lifecycle-archive.yml"
  pull_request:
    paths:
      - "src/cavra/customer_lifecycle_archive.py"
      - "scripts/validate_customer_lifecycle_archive.py"
      - "examples/customer-lifecycle-archive/**"
      - "tests/test_customer_lifecycle_archive.py"
      - ".github/workflows/customer-lifecycle-archive.yml"

jobs:
  validate-customer-lifecycle-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e . pytest ruff
      - name: Validate sample archive manifest
        run: python scripts/validate_customer_lifecycle_archive.py --packet examples/customer-lifecycle-archive/customer-lifecycle-archive.sample.json
      - name: Validate live sanitized archive manifest
        run: python scripts/validate_customer_lifecycle_archive.py --packet examples/customer-lifecycle-archive/customer-lifecycle-archive.live.sanitized.example.json --require-live
      - name: Run tests
        run: python -m pytest tests/test_customer_lifecycle_archive.py -q
      - name: Lint
        run: python -m ruff check src/cavra/customer_lifecycle_archive.py scripts/validate_customer_lifecycle_archive.py tests/test_customer_lifecycle_archive.py
