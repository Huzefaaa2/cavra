name: Customer Lifecycle Verification Index

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-verification-index.yml"
      - "examples/customer-lifecycle-verification-index/**"
      - "scripts/validate_customer_lifecycle_verification_index.py"
      - "src/cavra/customer_lifecycle_verification_index.py"
      - "tests/test_customer_lifecycle_verification_index.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/customer-lifecycle-verification-index.yml"
      - "examples/customer-lifecycle-verification-index/**"
      - "scripts/validate_customer_lifecycle_verification_index.py"
      - "src/cavra/customer_lifecycle_verification_index.py"
      - "tests/test_customer_lifecycle_verification_index.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Validate sample index shape
        run: python scripts/validate_customer_lifecycle_verification_index.py --index examples/customer-lifecycle-verification-index/customer-lifecycle-verification-index.sample.json --repo-root .
      - name: Validate live sanitized index
        run: python scripts/validate_customer_lifecycle_verification_index.py --index examples/customer-lifecycle-verification-index/customer-lifecycle-verification-index.live.sanitized.example.json --repo-root . --require-live
      - name: Run verification index tests
        run: python -m pytest tests/test_customer_lifecycle_verification_index.py tests/test_customer_lifecycle_final_seal.py -q
      - name: Lint verification index implementation
        run: python -m ruff check src/cavra/customer_lifecycle_verification_index.py scripts/validate_customer_lifecycle_verification_index.py tests/test_customer_lifecycle_verification_index.py src/cavra/cli.py
