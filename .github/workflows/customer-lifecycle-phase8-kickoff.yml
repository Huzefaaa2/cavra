name: Customer Lifecycle Phase 8 Kickoff

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-kickoff.yml"
      - "examples/customer-lifecycle-phase8-kickoff/**"
      - "scripts/validate_customer_lifecycle_phase8_kickoff.py"
      - "src/cavra/customer_lifecycle_phase8_kickoff.py"
      - "tests/test_customer_lifecycle_phase8_kickoff.py"
      - "src/cavra/cli.py"
  push:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-kickoff.yml"
      - "examples/customer-lifecycle-phase8-kickoff/**"
      - "scripts/validate_customer_lifecycle_phase8_kickoff.py"
      - "src/cavra/customer_lifecycle_phase8_kickoff.py"
      - "tests/test_customer_lifecycle_phase8_kickoff.py"
      - "src/cavra/cli.py"
  workflow_dispatch:

jobs:
  validate-phase8-kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Phase 8 kickoff packet
        run: python scripts/validate_customer_lifecycle_phase8_kickoff.py --packet examples/customer-lifecycle-phase8-kickoff/customer-lifecycle-phase8-kickoff.sample.json --repo-root .
      - name: Validate live sanitized Phase 8 kickoff packet
        run: python scripts/validate_customer_lifecycle_phase8_kickoff.py --packet examples/customer-lifecycle-phase8-kickoff/customer-lifecycle-phase8-kickoff.live.sanitized.example.json --repo-root . --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_customer_lifecycle_phase8_kickoff.py tests/test_customer_lifecycle_phase8_backlog.py -q
      - name: Lint Phase 8 kickoff surfaces
        run: python -m ruff check src/cavra/customer_lifecycle_phase8_kickoff.py scripts/validate_customer_lifecycle_phase8_kickoff.py tests/test_customer_lifecycle_phase8_kickoff.py src/cavra/cli.py
