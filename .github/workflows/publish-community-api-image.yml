name: Publish Community API Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "community-v*"
      - "v*"
    paths:
      - "src/**"
      - "policies/community/**"
      - "pyproject.toml"
      - "setup.py"
      - "docker/Dockerfile.azure-api"
      - ".github/workflows/publish-community-api-image.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/huzefaaa2/cavra-community-api

jobs:
  publish:
    name: build-and-publish-community-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=community-v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.azure-api
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Show image tags
        run: |
          echo "${{ steps.meta.outputs.tags }}"
