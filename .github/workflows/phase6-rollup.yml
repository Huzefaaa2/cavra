name: Phase 6 Rollup

on:
  pull_request:
    paths:
      - "src/cavra/phase6_rollup.py"
      - "scripts/validate_phase6_rollup.py"
      - "examples/phase6-rollup/**"
      - "tests/test_phase6_rollup.py"
      - ".github/workflows/phase6-rollup.yml"
  push:
    branches:
      - main
    paths:
      - "src/cavra/phase6_rollup.py"
      - "scripts/validate_phase6_rollup.py"
      - "examples/phase6-rollup/**"
      - "tests/test_phase6_rollup.py"
      - ".github/workflows/phase6-rollup.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAVRA
        run: python -m pip install -e . pytest ruff

      - name: Validate generated rollup
        run: python scripts/validate_phase6_rollup.py --repo-root .

      - name: Validate checked-in rollup packet
        run: |
          python scripts/validate_phase6_rollup.py \
            --packet examples/phase6-rollup/phase6-ecosystem-rollup.json \
            --repo-root .

      - name: Test
        run: python -m pytest tests/test_phase6_rollup.py -q

      - name: Lint
        run: |
          python -m ruff check \
            src/cavra/phase6_rollup.py \
            scripts/validate_phase6_rollup.py \
            tests/test_phase6_rollup.py
