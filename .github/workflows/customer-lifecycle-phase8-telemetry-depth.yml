name: Customer Lifecycle Phase 8 Telemetry Depth

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-telemetry-depth.yml"
      - "examples/customer-lifecycle-phase8-telemetry-depth/**"
      - "scripts/validate_customer_lifecycle_phase8_telemetry_depth.py"
      - "src/cavra/customer_lifecycle_phase8_telemetry_depth.py"
      - "tests/test_customer_lifecycle_phase8_telemetry_depth.py"
      - "src/cavra/cli.py"
  push:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-telemetry-depth.yml"
      - "examples/customer-lifecycle-phase8-telemetry-depth/**"
      - "scripts/validate_customer_lifecycle_phase8_telemetry_depth.py"
      - "src/cavra/customer_lifecycle_phase8_telemetry_depth.py"
      - "tests/test_customer_lifecycle_phase8_telemetry_depth.py"
      - "src/cavra/cli.py"
  workflow_dispatch:

jobs:
  validate-phase8-telemetry-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Phase 8 telemetry depth packet
        run: python scripts/validate_customer_lifecycle_phase8_telemetry_depth.py --packet examples/customer-lifecycle-phase8-telemetry-depth/customer-lifecycle-phase8-telemetry-depth.sample.json --repo-root .
      - name: Validate live sanitized Phase 8 telemetry depth packet
        run: python scripts/validate_customer_lifecycle_phase8_telemetry_depth.py --packet examples/customer-lifecycle-phase8-telemetry-depth/customer-lifecycle-phase8-telemetry-depth.live.sanitized.example.json --repo-root . --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_customer_lifecycle_phase8_telemetry_depth.py tests/test_customer_lifecycle_phase8_sprint1_checkpoint.py -q
      - name: Lint Phase 8 telemetry depth surfaces
        run: python -m ruff check src/cavra/customer_lifecycle_phase8_telemetry_depth.py scripts/validate_customer_lifecycle_phase8_telemetry_depth.py tests/test_customer_lifecycle_phase8_telemetry_depth.py src/cavra/cli.py
