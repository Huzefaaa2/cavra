name: Zero-Trust Reference Deployments

on:
  pull_request:
    paths:
      - "src/cavra/zero_trust_reference_deployments.py"
      - "scripts/validate_zero_trust_reference_deployments.py"
      - "examples/reference-deployments/**"
      - "tests/test_zero_trust_reference_deployments.py"
      - ".github/workflows/zero-trust-reference-deployments.yml"
  push:
    branches:
      - main
    paths:
      - "src/cavra/zero_trust_reference_deployments.py"
      - "scripts/validate_zero_trust_reference_deployments.py"
      - "examples/reference-deployments/**"
      - "tests/test_zero_trust_reference_deployments.py"
      - ".github/workflows/zero-trust-reference-deployments.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAVRA
        run: python -m pip install -e . pytest ruff

      - name: Validate catalog
        run: |
          python scripts/validate_zero_trust_reference_deployments.py \
            --catalog examples/reference-deployments/zero-trust-reference-deployments.json \
            --repo-root .

      - name: Validate sample readiness packet
        run: |
          python scripts/validate_zero_trust_reference_deployments.py \
            --packet examples/reference-deployments/zero-trust-reference-deployments.sample.json \
            --repo-root .

      - name: Validate live sanitized readiness example
        run: |
          python scripts/validate_zero_trust_reference_deployments.py \
            --packet examples/reference-deployments/zero-trust-reference-deployments.live.sanitized.example.json \
            --repo-root . \
            --require-live

      - name: Test
        run: python -m pytest tests/test_zero_trust_reference_deployments.py -q

      - name: Lint
        run: |
          python -m ruff check \
            src/cavra/zero_trust_reference_deployments.py \
            scripts/validate_zero_trust_reference_deployments.py \
            tests/test_zero_trust_reference_deployments.py
