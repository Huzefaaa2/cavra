name: Managed Enterprise Cutover Runbook

on:
  pull_request:
    paths:
      - ".github/workflows/managed-enterprise-cutover-runbook.yml"
      - "README.md"
      - "docs/managed-enterprise-cutover-runbook.md"
      - "docs/wiki/Managed-Enterprise-Cutover-Runbook.md"
      - "examples/managed-enterprise-cutover/**"
      - "scripts/validate_managed_enterprise_cutover_runbook.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_cutover_runbook.py"
      - "tests/test_managed_enterprise_cutover_runbook.py"
  push:
    paths:
      - ".github/workflows/managed-enterprise-cutover-runbook.yml"
      - "README.md"
      - "docs/managed-enterprise-cutover-runbook.md"
      - "docs/wiki/Managed-Enterprise-Cutover-Runbook.md"
      - "examples/managed-enterprise-cutover/**"
      - "scripts/validate_managed_enterprise_cutover_runbook.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_cutover_runbook.py"
      - "tests/test_managed_enterprise_cutover_runbook.py"
  workflow_dispatch:

jobs:
  validate-managed-enterprise-cutover-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Managed/Enterprise cutover runbook
        run: python scripts/validate_managed_enterprise_cutover_runbook.py --runbook examples/managed-enterprise-cutover/managed-enterprise-cutover-runbook.sample.json
      - name: Validate live sanitized Managed/Enterprise cutover runbook
        run: python scripts/validate_managed_enterprise_cutover_runbook.py --runbook examples/managed-enterprise-cutover/managed-enterprise-cutover-runbook.live.sanitized.example.json --require-live
      - name: Validate live sanitized cutover runbook through CAVRA CLI
        run: python -m cavra.cli release managed-enterprise-cutover-runbook --runbook examples/managed-enterprise-cutover/managed-enterprise-cutover-runbook.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_managed_enterprise_cutover_runbook.py -q
      - name: Lint Managed/Enterprise cutover runbook surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/managed_enterprise_cutover_runbook.py scripts/validate_managed_enterprise_cutover_runbook.py tests/test_managed_enterprise_cutover_runbook.py
