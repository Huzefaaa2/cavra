name: Roadmap Candidate Charter

on:
  pull_request:
    paths:
      - ".github/workflows/roadmap-candidate-charter.yml"
      - "README.md"
      - "docs/roadmap-candidate-charter.md"
      - "docs/wiki/Roadmap-Candidate-Charter.md"
      - "examples/roadmap-candidate-charter/**"
      - "scripts/validate_roadmap_candidate_charter.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_candidate_charter.py"
      - "src/cavra/roadmap_intake_gate.py"
      - "tests/test_roadmap_candidate_charter.py"
  push:
    paths:
      - ".github/workflows/roadmap-candidate-charter.yml"
      - "README.md"
      - "docs/roadmap-candidate-charter.md"
      - "docs/wiki/Roadmap-Candidate-Charter.md"
      - "examples/roadmap-candidate-charter/**"
      - "scripts/validate_roadmap_candidate_charter.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_candidate_charter.py"
      - "src/cavra/roadmap_intake_gate.py"
      - "tests/test_roadmap_candidate_charter.py"
  workflow_dispatch:

jobs:
  validate-roadmap-candidate-charter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate live sanitized roadmap candidate charter
        run: python scripts/validate_roadmap_candidate_charter.py --charter examples/roadmap-candidate-charter/roadmap-candidate-charter.live.sanitized.example.json --require-live
      - name: Validate through CAVRA CLI
        run: python -m cavra.cli release roadmap-candidate-charter --charter examples/roadmap-candidate-charter/roadmap-candidate-charter.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_roadmap_candidate_charter.py tests/test_roadmap_intake_gate.py tests/test_roadmap_completion_boundary.py -q
      - name: Lint roadmap candidate charter surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/roadmap_candidate_charter.py src/cavra/roadmap_intake_gate.py scripts/validate_roadmap_candidate_charter.py tests/test_roadmap_candidate_charter.py
