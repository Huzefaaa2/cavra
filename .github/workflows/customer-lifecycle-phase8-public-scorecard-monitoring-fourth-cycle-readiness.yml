name: Customer Lifecycle Phase 8 Public Scorecard Monitoring Fourth-Cycle Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness.yml"
      - "examples/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness/**"
      - "scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
      - "src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
      - "tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
  push:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness.yml"
      - "examples/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness/**"
      - "scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
      - "src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
      - "tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py"
  workflow_dispatch:

jobs:
  validate-phase8-public-scorecard-monitoring-fourth-cycle-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Phase 8 public scorecard monitoring fourth-cycle readiness packet
        run: python scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py --packet examples/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness.sample.json --repo-root .
      - name: Validate live sanitized Phase 8 public scorecard monitoring fourth-cycle readiness packet
        run: python scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py --packet examples/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness/customer-lifecycle-phase8-public-scorecard-monitoring-fourth-cycle-readiness.live.sanitized.example.json --repo-root . --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py -q
      - name: Lint Phase 8 public scorecard monitoring fourth-cycle readiness surfaces
        run: python -m ruff check src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_fourth_cycle_readiness.py
