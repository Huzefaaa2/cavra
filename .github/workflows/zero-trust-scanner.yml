name: Zero-Trust Scanner Agent

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the zero-trust scanner readiness packet JSON."
        required: false
        default: "examples/zero-trust-scanner/enterprise-zero-trust-scanner.sample.json"
      require_live:
        description: "Require evidence_mode=live and fail on sample packets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "src/cavra/zero_trust_scanner.py"
      - "scripts/validate_zero_trust_scanner.py"
      - "examples/zero-trust-scanner/**"
      - "tests/test_zero_trust_scanner.py"
      - ".github/workflows/zero-trust-scanner.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/zero_trust_scanner.py"
      - "scripts/validate_zero_trust_scanner.py"
      - "examples/zero-trust-scanner/**"
      - "tests/test_zero_trust_scanner.py"
      - ".github/workflows/zero-trust-scanner.yml"

permissions:
  contents: read

jobs:
  zero-trust-scanner-contract:
    name: Validate zero-trust scanner contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate metadata-only scan result
        run: |
          python scripts/validate_zero_trust_scanner.py \
            --scan-result examples/zero-trust-scanner/scan-result.sample.json \
            --output dist/zero-trust-scan-result-validation.json
      - name: Confirm raw egress is blocked
        run: |
          ! python scripts/validate_zero_trust_scanner.py \
            --scan-result examples/zero-trust-scanner/scan-result.invalid-raw-egress.json \
            --output dist/zero-trust-scan-result-invalid.json
      - name: Build normalized scanner result
        run: |
          python scripts/validate_zero_trust_scanner.py \
            --scan-result examples/zero-trust-scanner/scan-result.sample.json \
            --build-result \
            --output dist/zero-trust-scan-result-built.json
      - name: Validate hash-only file scan
        run: |
          python scripts/validate_zero_trust_scanner.py \
            --scan-file examples/zero-trust-scanner/reference-artifact.txt \
            --output dist/zero-trust-reference-file-scan.json
      - name: Validate sample packet
        run: |
          python scripts/validate_zero_trust_scanner.py \
            --packet examples/zero-trust-scanner/enterprise-zero-trust-scanner.sample.json \
            --output dist/enterprise-zero-trust-scanner-sample.json
      - name: Validate sanitized live packet
        run: |
          python scripts/validate_zero_trust_scanner.py \
            --packet examples/zero-trust-scanner/enterprise-zero-trust-scanner.live.sanitized.example.json \
            --require-live \
            --output dist/enterprise-zero-trust-scanner-live-sanitized.json
      - name: Test zero-trust scanner
        run: python -m pytest tests/test_zero_trust_scanner.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: zero-trust-scanner
          path: |
            dist/zero-trust-scan-result-validation.json
            dist/zero-trust-scan-result-invalid.json
            dist/zero-trust-scan-result-built.json
            dist/zero-trust-reference-file-scan.json
            dist/enterprise-zero-trust-scanner-sample.json
            dist/enterprise-zero-trust-scanner-live-sanitized.json

  zero-trust-scanner-live:
    name: Validate selected live zero-trust scanner packet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate selected packet
        run: |
          REQUIRE_LIVE=""
          if [ "${{ inputs.require_live }}" = "true" ]; then
            REQUIRE_LIVE="--require-live"
          fi
          python scripts/validate_zero_trust_scanner.py \
            --packet "${{ inputs.packet_path }}" \
            $REQUIRE_LIVE \
            --output dist/enterprise-zero-trust-scanner-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: zero-trust-scanner-live
          path: dist/enterprise-zero-trust-scanner-live.json
