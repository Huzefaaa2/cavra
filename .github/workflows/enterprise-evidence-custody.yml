name: Enterprise Evidence Custody

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the evidence custody packet JSON."
        required: false
        default: "examples/evidence/enterprise-evidence-custody.sample.json"
      require_live:
        description: "Require evidence_mode=live and fail on sample packets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "src/cavra/evidence_custody.py"
      - "scripts/validate_enterprise_evidence_custody.py"
      - "examples/evidence/enterprise-evidence-custody.sample.json"
      - "examples/evidence/enterprise-evidence-custody.live.sanitized.example.json"
      - "tests/test_evidence_custody.py"
      - ".github/workflows/enterprise-evidence-custody.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/evidence_custody.py"
      - "scripts/validate_enterprise_evidence_custody.py"
      - "examples/evidence/enterprise-evidence-custody.sample.json"
      - "examples/evidence/enterprise-evidence-custody.live.sanitized.example.json"
      - "tests/test_evidence_custody.py"
      - ".github/workflows/enterprise-evidence-custody.yml"

permissions:
  contents: read

jobs:
  evidence-custody-contract:
    name: Validate evidence custody contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate sample evidence custody packet
        run: |
          python scripts/validate_enterprise_evidence_custody.py \
            --packet examples/evidence/enterprise-evidence-custody.sample.json \
            --output dist/enterprise-evidence-custody-sample.json
      - name: Test evidence custody contract
        run: python -m pytest tests/test_evidence_custody.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-evidence-custody-sample
          path: dist/enterprise-evidence-custody-sample.json

  evidence-custody-live:
    name: Validate live evidence custody packet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate selected evidence custody packet
        run: |
          REQUIRE_LIVE=""
          if [ "${{ inputs.require_live }}" = "true" ]; then
            REQUIRE_LIVE="--require-live"
          fi
          python scripts/validate_enterprise_evidence_custody.py \
            --packet "${{ inputs.packet_path }}" \
            $REQUIRE_LIVE \
            --output dist/enterprise-evidence-custody-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-evidence-custody-live
          path: dist/enterprise-evidence-custody-live.json
