name: API Contract

on:
  pull_request:
    paths:
      - "src/cavra/api.py"
      - "src/cavra/**"
      - "openapi/**"
      - "scripts/export_openapi_contract.py"
      - "scripts/validate_openapi_contract.py"
      - "tests/test_openapi_contract.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/cavra/api.py"
      - "src/cavra/**"
      - "openapi/**"
      - "scripts/export_openapi_contract.py"
      - "scripts/validate_openapi_contract.py"
      - "tests/test_openapi_contract.py"
      - "pyproject.toml"

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate checked-in OpenAPI contract
        run: python3 scripts/validate_openapi_contract.py
      - name: Run OpenAPI tests
        run: python3 -m pytest tests/test_openapi_contract.py -q
