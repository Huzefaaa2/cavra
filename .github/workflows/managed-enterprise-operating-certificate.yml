name: Managed Enterprise Operating Certificate

on:
  pull_request:
    paths:
      - ".github/workflows/managed-enterprise-operating-certificate.yml"
      - "README.md"
      - "docs/managed-enterprise-operating-certificate.md"
      - "docs/wiki/Managed-Enterprise-Operating-Certificate.md"
      - "examples/managed-enterprise-operating-certificate/**"
      - "scripts/validate_managed_enterprise_operating_certificate.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_operating_certificate.py"
      - "tests/test_managed_enterprise_operating_certificate.py"
  push:
    paths:
      - ".github/workflows/managed-enterprise-operating-certificate.yml"
      - "README.md"
      - "docs/managed-enterprise-operating-certificate.md"
      - "docs/wiki/Managed-Enterprise-Operating-Certificate.md"
      - "examples/managed-enterprise-operating-certificate/**"
      - "scripts/validate_managed_enterprise_operating_certificate.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_operating_certificate.py"
      - "tests/test_managed_enterprise_operating_certificate.py"
  workflow_dispatch:

jobs:
  validate-managed-enterprise-operating-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Managed/Enterprise operating certificate
        run: python scripts/validate_managed_enterprise_operating_certificate.py --certificate examples/managed-enterprise-operating-certificate/managed-enterprise-operating-certificate.sample.json
      - name: Validate live sanitized Managed/Enterprise operating certificate
        run: python scripts/validate_managed_enterprise_operating_certificate.py --certificate examples/managed-enterprise-operating-certificate/managed-enterprise-operating-certificate.live.sanitized.example.json --require-live
      - name: Validate live sanitized operating certificate through CAVRA CLI
        run: python -m cavra.cli release managed-enterprise-operating-certificate --certificate examples/managed-enterprise-operating-certificate/managed-enterprise-operating-certificate.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_managed_enterprise_operating_certificate.py -q
      - name: Lint Managed/Enterprise operating certificate surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/managed_enterprise_operating_certificate.py scripts/validate_managed_enterprise_operating_certificate.py tests/test_managed_enterprise_operating_certificate.py
