name: Customer Evidence Room

on:
  pull_request:
    paths:
      - "src/cavra/customer_evidence_room.py"
      - "scripts/validate_customer_evidence_room.py"
      - "examples/customer-evidence-room/**"
      - "tests/test_customer_evidence_room.py"
      - ".github/workflows/customer-evidence-room.yml"
  push:
    branches:
      - main
    paths:
      - "src/cavra/customer_evidence_room.py"
      - "scripts/validate_customer_evidence_room.py"
      - "examples/customer-evidence-room/**"
      - "tests/test_customer_evidence_room.py"
      - ".github/workflows/customer-evidence-room.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAVRA
        run: python -m pip install -e . pytest ruff

      - name: Validate sample index
        run: |
          python scripts/validate_customer_evidence_room.py \
            --index examples/customer-evidence-room/customer-evidence-room.sample.json

      - name: Validate live sanitized example
        run: |
          python scripts/validate_customer_evidence_room.py \
            --index examples/customer-evidence-room/customer-evidence-room.live.sanitized.example.json \
            --require-live

      - name: Test
        run: python -m pytest tests/test_customer_evidence_room.py -q

      - name: Lint
        run: |
          python -m ruff check \
            src/cavra/customer_evidence_room.py \
            scripts/validate_customer_evidence_room.py \
            tests/test_customer_evidence_room.py
