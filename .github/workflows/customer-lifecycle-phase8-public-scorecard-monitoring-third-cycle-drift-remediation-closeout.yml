name: Customer Lifecycle Phase 8 Public Scorecard Monitoring Third-Cycle Drift Remediation Closeout

on:
  pull_request:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout.yml"
      - "examples/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout/**"
      - "scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
      - "src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
      - "tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
  push:
    paths:
      - ".github/workflows/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout.yml"
      - "examples/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout/**"
      - "scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
      - "src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
      - "tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py"
  workflow_dispatch:

jobs:
  validate-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Phase 8 public scorecard monitoring third-cycle drift remediation closeout packet
        run: python scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py --packet examples/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout.sample.json --repo-root .
      - name: Validate live sanitized Phase 8 public scorecard monitoring third-cycle drift remediation closeout packet
        run: python scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py --packet examples/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout/customer-lifecycle-phase8-public-scorecard-monitoring-third-cycle-drift-remediation-closeout.live.sanitized.example.json --repo-root . --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_first_review.py -q
      - name: Lint Phase 8 public scorecard monitoring third-cycle drift remediation closeout surfaces
        run: python -m ruff check src/cavra/customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py scripts/validate_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py tests/test_customer_lifecycle_phase8_public_scorecard_monitoring_third_cycle_drift_remediation_closeout.py
