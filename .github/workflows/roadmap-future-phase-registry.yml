name: Roadmap Future Phase Registry

on:
  pull_request:
    paths:
      - ".github/workflows/roadmap-future-phase-registry.yml"
      - "README.md"
      - "docs/roadmap-future-phase-registry.md"
      - "docs/wiki/Roadmap-Future-Phase-Registry.md"
      - "examples/roadmap-future-phase-registry/**"
      - "scripts/validate_roadmap_future_phase_registry.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_future_phase_opening_gate.py"
      - "src/cavra/roadmap_future_phase_registry.py"
      - "tests/test_roadmap_future_phase_registry.py"
  push:
    paths:
      - ".github/workflows/roadmap-future-phase-registry.yml"
      - "README.md"
      - "docs/roadmap-future-phase-registry.md"
      - "docs/wiki/Roadmap-Future-Phase-Registry.md"
      - "examples/roadmap-future-phase-registry/**"
      - "scripts/validate_roadmap_future_phase_registry.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_future_phase_opening_gate.py"
      - "src/cavra/roadmap_future_phase_registry.py"
      - "tests/test_roadmap_future_phase_registry.py"
  workflow_dispatch:

jobs:
  validate-roadmap-future-phase-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate live sanitized roadmap future phase registry
        run: python scripts/validate_roadmap_future_phase_registry.py --registry examples/roadmap-future-phase-registry/roadmap-future-phase-registry.live.sanitized.example.json --require-live
      - name: Validate through CAVRA CLI
        run: python -m cavra.cli release roadmap-future-phase-registry --registry examples/roadmap-future-phase-registry/roadmap-future-phase-registry.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_roadmap_future_phase_registry.py tests/test_roadmap_future_phase_opening_gate.py tests/test_roadmap_completion_boundary.py -q
      - name: Lint roadmap future phase registry surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/roadmap_future_phase_registry.py src/cavra/roadmap_future_phase_opening_gate.py scripts/validate_roadmap_future_phase_registry.py tests/test_roadmap_future_phase_registry.py
