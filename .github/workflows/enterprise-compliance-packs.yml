name: Enterprise Compliance Packs

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the compliance mapping-pack readiness packet JSON."
        required: false
        default: "examples/compliance/enterprise-compliance-packs.sample.json"
      require_live:
        description: "Require evidence_mode=live and fail on sample packets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "src/cavra/compliance_packs.py"
      - "scripts/validate_enterprise_compliance_packs.py"
      - "examples/compliance/enterprise-compliance-packs.sample.json"
      - "examples/compliance/enterprise-compliance-packs.live.sanitized.example.json"
      - "examples/compliance/sample-findings.json"
      - "tests/test_compliance_packs.py"
      - ".github/workflows/enterprise-compliance-packs.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/compliance_packs.py"
      - "scripts/validate_enterprise_compliance_packs.py"
      - "examples/compliance/enterprise-compliance-packs.sample.json"
      - "examples/compliance/enterprise-compliance-packs.live.sanitized.example.json"
      - "examples/compliance/sample-findings.json"
      - "tests/test_compliance_packs.py"
      - ".github/workflows/enterprise-compliance-packs.yml"

permissions:
  contents: read

jobs:
  compliance-pack-contract:
    name: Validate compliance mapping-pack contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate built-in registry
        run: |
          python scripts/validate_enterprise_compliance_packs.py \
            --registry \
            --output dist/enterprise-compliance-pack-registry.json
      - name: Validate sample compliance mapping-pack packet
        run: |
          python scripts/validate_enterprise_compliance_packs.py \
            --packet examples/compliance/enterprise-compliance-packs.sample.json \
            --output dist/enterprise-compliance-packs-sample.json
      - name: Validate sample finding-to-clause report
        run: |
          python scripts/validate_enterprise_compliance_packs.py \
            --findings examples/compliance/sample-findings.json \
            --output dist/enterprise-compliance-mapping-report.json
      - name: Test compliance mapping packs
        run: python -m pytest tests/test_compliance_packs.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-compliance-packs-sample
          path: |
            dist/enterprise-compliance-pack-registry.json
            dist/enterprise-compliance-packs-sample.json
            dist/enterprise-compliance-mapping-report.json

  compliance-pack-live:
    name: Validate live compliance mapping-pack packet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate selected compliance mapping-pack packet
        run: |
          REQUIRE_LIVE=""
          if [ "${{ inputs.require_live }}" = "true" ]; then
            REQUIRE_LIVE="--require-live"
          fi
          python scripts/validate_enterprise_compliance_packs.py \
            --packet "${{ inputs.packet_path }}" \
            $REQUIRE_LIVE \
            --output dist/enterprise-compliance-packs-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-compliance-packs-live
          path: dist/enterprise-compliance-packs-live.json
