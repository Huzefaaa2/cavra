name: Roadmap Future Work Governance Index

on:
  pull_request:
    paths:
      - ".github/workflows/roadmap-future-work-governance-index.yml"
      - "README.md"
      - "docs/roadmap-future-work-governance-index.md"
      - "docs/wiki/Roadmap-Future-Work-Governance-Index.md"
      - "examples/roadmap-future-work-governance-index/**"
      - "scripts/validate_roadmap_future_work_governance_index.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_future_work_governance_index.py"
      - "tests/test_roadmap_future_work_governance_index.py"
  push:
    paths:
      - ".github/workflows/roadmap-future-work-governance-index.yml"
      - "README.md"
      - "docs/roadmap-future-work-governance-index.md"
      - "docs/wiki/Roadmap-Future-Work-Governance-Index.md"
      - "examples/roadmap-future-work-governance-index/**"
      - "scripts/validate_roadmap_future_work_governance_index.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_future_work_governance_index.py"
      - "tests/test_roadmap_future_work_governance_index.py"
  workflow_dispatch:

jobs:
  validate-roadmap-future-work-governance-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate live sanitized roadmap future work governance index
        run: python scripts/validate_roadmap_future_work_governance_index.py --index examples/roadmap-future-work-governance-index/roadmap-future-work-governance-index.live.sanitized.example.json --require-live
      - name: Validate through CAVRA CLI
        run: python -m cavra.cli release roadmap-future-work-governance-index --index examples/roadmap-future-work-governance-index/roadmap-future-work-governance-index.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_roadmap_future_work_governance_index.py tests/test_roadmap_future_phase_registry.py tests/test_roadmap_completion_boundary.py -q
      - name: Lint roadmap future work governance index surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/roadmap_future_work_governance_index.py scripts/validate_roadmap_future_work_governance_index.py tests/test_roadmap_future_work_governance_index.py
