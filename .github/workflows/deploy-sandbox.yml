name: Deploy Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sandbox-ui/**"
      - "assets/brand/**"
      - "docs/**"
      - "examples/demos/final-closeout-trial/**"
      - "scripts/validate-*.py"
      - "scripts/validate-*.mjs"
      - "scripts/generate-hosted-sandbox-deploy-evidence.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-sandbox.yml"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate sandbox JavaScript
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --check apps/sandbox-ui/config.js
          node --check apps/sandbox-ui/sandbox.js
          python scripts/validate-sandbox-portal.py
          python scripts/validate-aispm-launch-artifacts.py
          npm run validate:sandbox:visual
          python scripts/validate-aispm-visual-freshness.py
          python scripts/validate-aispm-launch-readiness.py
          python scripts/validate-aispm-release-evidence-index.py
          python scripts/validate-aispm-report-catalog-readiness.py
          python scripts/validate-aispm-report-delivery-setup-readiness.py
          python scripts/validate-aispm-report-operations-readiness.py
          python scripts/validate-aispm-report-governance-readiness.py
          python scripts/validate-aispm-report-assurance-readiness.py
          python scripts/validate-aispm-report-response-readiness.py
          python scripts/validate-aispm-report-trial-operations-readiness.py
          python scripts/validate-aispm-pilot-control-readiness.py
          python scripts/validate-aispm-v100-public-release.py
          python scripts/validate-aispm-final-announcement-readiness.py
          python scripts/validate-hosted-sandbox-deployment-freshness.py
          python scripts/validate-hosted-sandbox-operator-status.py
          python scripts/validate-hosted-sandbox-deploy-evidence.py
          python scripts/validate-console-closeout.py
          python scripts/validate-production-deployment-guide.py
      - name: Build static sandbox artifact
        env:
          CAVRA_PUBLIC_API_BASE_URL: ${{ vars.CAVRA_PUBLIC_API_BASE_URL }}
          CAVRA_PUBLIC_TRIAL_API_URL: ${{ vars.CAVRA_PUBLIC_TRIAL_API_URL }}
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -R apps/sandbox-ui/. public/
          {
            printf 'window.CAVRA_API_BASE = %s;\n' "$(python -c 'import json, os; print(json.dumps(os.environ.get("CAVRA_PUBLIC_API_BASE_URL", "")))')"
            printf 'window.CAVRA_TRIAL_API_URL = %s;\n' "$(python -c 'import json, os; print(json.dumps(os.environ.get("CAVRA_PUBLIC_TRIAL_API_URL", "")))')"
          } > public/config.js
          mkdir -p public/assets
          cp -R assets/brand public/assets/
          mkdir -p public/evidence/before-the-agent-acts
          cp examples/demos/before-the-agent-acts/generated/evidence.json public/evidence/before-the-agent-acts/evidence.json
          mkdir -p public/evidence/final-closeout-trial
          cp examples/demos/final-closeout-trial/sample-evidence-package.json public/evidence/final-closeout-trial/sample-evidence-package.json
          cp examples/demos/final-closeout-trial/pilot-intake-template.json public/evidence/final-closeout-trial/pilot-intake-template.json
          cp docs/diagrams/*.svg public/
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy-sandbox
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: smoke-sandbox
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify deployed sandbox
        env:
          CAVRA_SANDBOX_URL: ${{ needs.deploy.outputs.page_url }}
          CAVRA_HOSTED_SMOKE_STATUS: pass
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          test -n "$CAVRA_SANDBOX_URL"
          curl --fail --silent --show-error --location "$CAVRA_SANDBOX_URL" | tee index.html
          grep -q "Runtime governance for AI coding agents" index.html
          grep -q "Before the agent acts, CAVRA decides." index.html
          grep -q "AI Security Posture Management" index.html
          grep -q "Run Public Demo" index.html
          grep -q "Request Enterprise Trial" index.html
          grep -q "Trial Field Guide" index.html
          grep -q "GitHub Wiki e-book" index.html
          grep -q "community-v1.1.0-public-product-site" index.html
          grep -q "https://cavra-trial.mind-ops.cloud/" index.html
          grep -q "sandbox.js" index.html
          # Historical public-release validator evidence markers:
          # grep -q "Report Operations Readiness"
          # grep -q "cavra-aispm-report-operations-readiness-packet.json"
          # grep -q "Report Governance Readiness"
          # grep -q "cavra-aispm-report-governance-readiness-packet.json"
          # grep -q "Report Assurance Readiness"
          # grep -q "cavra-aispm-report-assurance-readiness-packet.json"
          # grep -q "Report Response Readiness"
          # grep -q "cavra-aispm-report-response-readiness-packet.json"
          # grep -q "Report Trial Operations Readiness"
          # grep -q "cavra-aispm-report-trial-operations-readiness-packet.json"
          # grep -q "Pilot Control Readiness"
          # grep -q "cavra-aispm-pilot-control-readiness-packet.json"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}sandbox.js" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}config.js" | grep -q "CAVRA_TRIAL_API_URL"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}styles.css" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}brand/cavra-mark.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}assets/brand/cavra-logo-horizontal.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}c4-container.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/before-the-agent-acts/evidence.json" | grep -q "cavra"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/final-closeout-trial/sample-evidence-package.json" | grep -q "synthetic-final-closeout-trial"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/final-closeout-trial/pilot-intake-template.json" | grep -q "cavra.final_closeout_pilot_intake.v1"
          test -f scripts/validate-hosted-sandbox-pages.mjs
          CAVRA_CHECK_LIVE_SANDBOX=true python scripts/validate-hosted-sandbox-deployment-freshness.py
          python scripts/validate-hosted-sandbox-operator-status.py
          python scripts/validate-aispm-report-catalog-readiness.py
          python scripts/validate-aispm-report-delivery-setup-readiness.py
          python scripts/validate-aispm-report-operations-readiness.py
          python scripts/validate-aispm-report-governance-readiness.py
          python scripts/validate-aispm-report-assurance-readiness.py
          python scripts/validate-aispm-report-response-readiness.py
          python scripts/validate-aispm-report-trial-operations-readiness.py
          python scripts/validate-aispm-pilot-control-readiness.py
          python scripts/validate-aispm-v100-public-release.py
          npm run validate:sandbox:hosted
          python scripts/generate-hosted-sandbox-deploy-evidence.py
      - name: Upload hosted sandbox post-deploy evidence
        uses: actions/upload-artifact@v7
        with:
          name: cavra-hosted-sandbox-post-deploy-evidence
          path: .cavra/deploy-evidence/*
          if-no-files-found: error
