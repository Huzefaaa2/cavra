name: Deploy Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sandbox-ui/**"
      - "assets/brand/**"
      - "docs/**"
      - "examples/demos/final-closeout-trial/**"
      - ".github/workflows/deploy-sandbox.yml"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate sandbox JavaScript
        run: |
          node --check apps/sandbox-ui/config.js
          node --check apps/sandbox-ui/sandbox.js
          python scripts/validate-sandbox-portal.py
          python scripts/validate-console-closeout.py
          python scripts/validate-production-deployment-guide.py
      - name: Build static sandbox artifact
        env:
          CAVRA_PUBLIC_API_BASE_URL: ${{ vars.CAVRA_PUBLIC_API_BASE_URL }}
          CAVRA_PUBLIC_TRIAL_API_URL: ${{ vars.CAVRA_PUBLIC_TRIAL_API_URL }}
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -R apps/sandbox-ui/. public/
          {
            printf 'window.CAVRA_API_BASE = %s;\n' "$(python -c 'import json, os; print(json.dumps(os.environ.get("CAVRA_PUBLIC_API_BASE_URL", "")))')"
            printf 'window.CAVRA_TRIAL_API_URL = %s;\n' "$(python -c 'import json, os; print(json.dumps(os.environ.get("CAVRA_PUBLIC_TRIAL_API_URL", "")))')"
          } > public/config.js
          mkdir -p public/assets
          cp -R assets/brand public/assets/
          mkdir -p public/evidence/before-the-agent-acts
          cp examples/demos/before-the-agent-acts/generated/evidence.json public/evidence/before-the-agent-acts/evidence.json
          mkdir -p public/evidence/final-closeout-trial
          cp examples/demos/final-closeout-trial/sample-evidence-package.json public/evidence/final-closeout-trial/sample-evidence-package.json
          cp examples/demos/final-closeout-trial/pilot-intake-template.json public/evidence/final-closeout-trial/pilot-intake-template.json
          cp docs/diagrams/*.svg public/
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy-sandbox
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: smoke-sandbox
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed sandbox
        env:
          CAVRA_SANDBOX_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$CAVRA_SANDBOX_URL"
          curl --fail --silent --show-error --location "$CAVRA_SANDBOX_URL" | tee index.html
          grep -q "Evidence Console" index.html
          grep -q "Community GA Control Hardening" index.html
          grep -q "Production Pilot Readiness" index.html
          grep -q "Enterprise Trial Access Portal" index.html
          grep -q "https://cavra-trial.mind-ops.cloud/" index.html
          grep -q "sandbox.js" index.html
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}sandbox.js" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}config.js" | grep -q "CAVRA_TRIAL_API_URL"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}styles.css" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}brand/cavra-mark.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}assets/brand/cavra-logo-horizontal.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}c4-container.svg" >/dev/null
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/before-the-agent-acts/evidence.json" | grep -q "cavra"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/final-closeout-trial/sample-evidence-package.json" | grep -q "synthetic-final-closeout-trial"
          curl --fail --silent --show-error --location "${CAVRA_SANDBOX_URL}evidence/final-closeout-trial/pilot-intake-template.json" | grep -q "cavra.final_closeout_pilot_intake.v1"
