name: Phase 4 Connector Scanner Closeout

on:
  pull_request:
    paths:
      - "src/cavra/phase4_closeout.py"
      - "src/cavra/connector_sdk.py"
      - "src/cavra/certified_connectors.py"
      - "src/cavra/model_registry_connectors.py"
      - "src/cavra/zero_trust_scanner.py"
      - "scripts/validate_phase4_connector_scanner_closeout.py"
      - "examples/phase4-closeout/**"
      - "examples/connectors/**"
      - "examples/model-registries/**"
      - "examples/zero-trust-scanner/**"
      - "tests/test_phase4_closeout.py"
      - ".github/workflows/phase4-connector-scanner-closeout.yml"
  push:
    branches:
      - main
    paths:
      - "src/cavra/phase4_closeout.py"
      - "src/cavra/connector_sdk.py"
      - "src/cavra/certified_connectors.py"
      - "src/cavra/model_registry_connectors.py"
      - "src/cavra/zero_trust_scanner.py"
      - "scripts/validate_phase4_connector_scanner_closeout.py"
      - "examples/phase4-closeout/**"
      - "examples/connectors/**"
      - "examples/model-registries/**"
      - "examples/zero-trust-scanner/**"
      - "tests/test_phase4_closeout.py"
      - ".github/workflows/phase4-connector-scanner-closeout.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAVRA
        run: python -m pip install -e . pytest ruff

      - name: Validate generated closeout
        run: python scripts/validate_phase4_connector_scanner_closeout.py --repo-root .

      - name: Validate checked-in closeout packet
        run: |
          python scripts/validate_phase4_connector_scanner_closeout.py \
            --packet examples/phase4-closeout/phase4-connector-scanner-closeout.json \
            --repo-root .

      - name: Test
        run: python -m pytest tests/test_phase4_closeout.py -q

      - name: Lint
        run: |
          python -m ruff check \
            src/cavra/phase4_closeout.py \
            scripts/validate_phase4_connector_scanner_closeout.py \
            tests/test_phase4_closeout.py
