name: Managed Enterprise Operating Announcement

on:
  pull_request:
    paths:
      - ".github/workflows/managed-enterprise-operating-announcement.yml"
      - "README.md"
      - "docs/managed-enterprise-operating-announcement.md"
      - "docs/wiki/Managed-Enterprise-Operating-Announcement.md"
      - "examples/managed-enterprise-operating-announcement/**"
      - "scripts/validate_managed_enterprise_operating_announcement.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_operating_announcement.py"
      - "tests/test_managed_enterprise_operating_announcement.py"
  push:
    paths:
      - ".github/workflows/managed-enterprise-operating-announcement.yml"
      - "README.md"
      - "docs/managed-enterprise-operating-announcement.md"
      - "docs/wiki/Managed-Enterprise-Operating-Announcement.md"
      - "examples/managed-enterprise-operating-announcement/**"
      - "scripts/validate_managed_enterprise_operating_announcement.py"
      - "src/cavra/cli.py"
      - "src/cavra/managed_enterprise_operating_announcement.py"
      - "tests/test_managed_enterprise_operating_announcement.py"
  workflow_dispatch:

jobs:
  validate-managed-enterprise-operating-announcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate sample Managed/Enterprise operating announcement
        run: python scripts/validate_managed_enterprise_operating_announcement.py --announcement examples/managed-enterprise-operating-announcement/managed-enterprise-operating-announcement.sample.json
      - name: Validate live sanitized Managed/Enterprise operating announcement
        run: python scripts/validate_managed_enterprise_operating_announcement.py --announcement examples/managed-enterprise-operating-announcement/managed-enterprise-operating-announcement.live.sanitized.example.json --require-live
      - name: Validate live sanitized operating announcement through CAVRA CLI
        run: python -m cavra.cli release managed-enterprise-operating-announcement --announcement examples/managed-enterprise-operating-announcement/managed-enterprise-operating-announcement.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_managed_enterprise_operating_announcement.py -q
      - name: Lint Managed/Enterprise operating announcement surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/managed_enterprise_operating_announcement.py scripts/validate_managed_enterprise_operating_announcement.py tests/test_managed_enterprise_operating_announcement.py
