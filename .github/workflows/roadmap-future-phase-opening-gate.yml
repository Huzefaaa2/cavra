name: Roadmap Future Phase Opening Gate

on:
  pull_request:
    paths:
      - ".github/workflows/roadmap-future-phase-opening-gate.yml"
      - "README.md"
      - "docs/roadmap-future-phase-opening-gate.md"
      - "docs/wiki/Roadmap-Future-Phase-Opening-Gate.md"
      - "examples/roadmap-future-phase-opening-gate/**"
      - "scripts/validate_roadmap_future_phase_opening_gate.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_candidate_charter.py"
      - "src/cavra/roadmap_future_phase_opening_gate.py"
      - "src/cavra/roadmap_intake_gate.py"
      - "tests/test_roadmap_future_phase_opening_gate.py"
  push:
    paths:
      - ".github/workflows/roadmap-future-phase-opening-gate.yml"
      - "README.md"
      - "docs/roadmap-future-phase-opening-gate.md"
      - "docs/wiki/Roadmap-Future-Phase-Opening-Gate.md"
      - "examples/roadmap-future-phase-opening-gate/**"
      - "scripts/validate_roadmap_future_phase_opening_gate.py"
      - "src/cavra/cli.py"
      - "src/cavra/roadmap_candidate_charter.py"
      - "src/cavra/roadmap_future_phase_opening_gate.py"
      - "src/cavra/roadmap_intake_gate.py"
      - "tests/test_roadmap_future_phase_opening_gate.py"
  workflow_dispatch:

jobs:
  validate-roadmap-future-phase-opening-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate live sanitized roadmap future phase opening gate
        run: python scripts/validate_roadmap_future_phase_opening_gate.py --gate examples/roadmap-future-phase-opening-gate/roadmap-future-phase-opening-gate.live.sanitized.example.json --require-live
      - name: Validate through CAVRA CLI
        run: python -m cavra.cli release roadmap-future-phase-opening-gate --gate examples/roadmap-future-phase-opening-gate/roadmap-future-phase-opening-gate.live.sanitized.example.json --require-live
      - name: Run focused tests
        run: python -m pytest tests/test_roadmap_future_phase_opening_gate.py tests/test_roadmap_candidate_charter.py tests/test_roadmap_intake_gate.py tests/test_roadmap_completion_boundary.py -q
      - name: Lint roadmap future phase opening gate surfaces
        run: python -m ruff check src/cavra/cli.py src/cavra/roadmap_future_phase_opening_gate.py src/cavra/roadmap_candidate_charter.py src/cavra/roadmap_intake_gate.py scripts/validate_roadmap_future_phase_opening_gate.py tests/test_roadmap_future_phase_opening_gate.py
