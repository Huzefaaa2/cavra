name: Enterprise Audit Log

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: "Path to the audit-log readiness packet JSON."
        required: false
        default: "examples/audit/enterprise-audit-log.sample.json"
      require_live:
        description: "Require evidence_mode=live and fail on sample packets."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
    paths:
      - "src/cavra/audit_log.py"
      - "scripts/validate_enterprise_audit_log.py"
      - "examples/audit/enterprise-audit-log.sample.json"
      - "examples/audit/enterprise-audit-log.live.sanitized.example.json"
      - "tests/test_audit_log.py"
      - ".github/workflows/enterprise-audit-log.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/audit_log.py"
      - "scripts/validate_enterprise_audit_log.py"
      - "examples/audit/enterprise-audit-log.sample.json"
      - "examples/audit/enterprise-audit-log.live.sanitized.example.json"
      - "tests/test_audit_log.py"
      - ".github/workflows/enterprise-audit-log.yml"

permissions:
  contents: read

jobs:
  audit-log-contract:
    name: Validate audit-log contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate sample audit-log packet
        run: |
          python scripts/validate_enterprise_audit_log.py \
            --packet examples/audit/enterprise-audit-log.sample.json \
            --output dist/enterprise-audit-log-sample.json
      - name: Test audit-log contract
        run: python -m pytest tests/test_audit_log.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-audit-log-sample
          path: dist/enterprise-audit-log-sample.json

  audit-log-live:
    name: Validate live audit-log packet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate selected audit-log packet
        run: |
          REQUIRE_LIVE=""
          if [ "${{ inputs.require_live }}" = "true" ]; then
            REQUIRE_LIVE="--require-live"
          fi
          python scripts/validate_enterprise_audit_log.py \
            --packet "${{ inputs.packet_path }}" \
            $REQUIRE_LIVE \
            --output dist/enterprise-audit-log-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-audit-log-live
          path: dist/enterprise-audit-log-live.json
