name: Release Community

on:
  workflow_dispatch:
  push:
    tags:
      - "community-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/validate-python-package-metadata.py
      - run: python scripts/validate-release-packets.py
      - run: python scripts/validate-maintenance-release-evidence.py
      - run: python scripts/validate-community-release-note-freshness.py
      - run: python scripts/validate-community-release-index.py
      - run: python scripts/validate-community-release-readiness-dashboard.py
      - run: python scripts/validate-sandbox-portal.py
      - run: python scripts/validate-aispm-launch-artifacts.py
      - run: npm run validate:sandbox:visual
      - run: python scripts/validate-aispm-visual-freshness.py
      - run: python scripts/validate-aispm-launch-readiness.py
      - run: python scripts/validate-aispm-release-evidence-index.py
      - run: python scripts/validate-aispm-report-catalog-readiness.py
      - run: python scripts/validate-aispm-report-delivery-setup-readiness.py
      - run: python scripts/validate-aispm-report-operations-readiness.py
      - run: python scripts/validate-aispm-report-governance-readiness.py
      - run: python scripts/validate-aispm-report-assurance-readiness.py
      - run: python scripts/validate-aispm-report-response-readiness.py
      - run: python scripts/validate-aispm-report-trial-operations-readiness.py
      - run: python scripts/validate-aispm-pilot-control-readiness.py
      - run: python scripts/validate-aispm-v100-public-release.py
      - run: python scripts/validate-aispm-final-announcement-readiness.py
      - run: python scripts/validate-hosted-sandbox-deployment-freshness.py
      - run: python scripts/validate-hosted-sandbox-operator-status.py
      - run: python scripts/validate-hosted-sandbox-deploy-evidence.py
      - run: python scripts/validate-aispm-trial-lab-notebook.py --check-summary
      - run: python scripts/validate-console-closeout.py
      - run: python scripts/validate-community-ga-path.py
      - run: python scripts/validate-production-deployment-guide.py
      - run: python scripts/validate-go-production-hardening.py
      - run: python scripts/validate-enterprise-integration-readiness.py
      - run: python scripts/validate-production-readiness-procurement-closeout.py
      - run: python scripts/validate-community-v100-stabilization.py
      - run: python scripts/validate-community-v100-rc-hardening.py
      - run: python scripts/validate-community-v100-rc-publication.py
      - run: python scripts/validate-community-v100-rc-post-publication.py
      - run: python scripts/validate-community-v100-ga-readiness.py
      - run: python scripts/validate-community-v100-ga-publication-package.py
      - run: python scripts/validate-community-v100-ga-post-publication.py
      - run: python scripts/validate-community-release-keyless-attestation.py
      - run: bash scripts/validate-boundaries.sh .
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: cavra-community-dist
          path: dist/*
