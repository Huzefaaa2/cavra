name: AI Red Team And Supply Chain Gate

on:
  pull_request:
    paths:
      - "src/cavra/ai_red_team.py"
      - "src/cavra/cli.py"
      - "scripts/validate_ai_red_team.py"
      - "examples/ai-red-team/**"
      - "tests/test_ai_red_team.py"
      - ".github/workflows/ai-red-team.yml"
  push:
    branches: [main]
    paths:
      - "src/cavra/ai_red_team.py"
      - "src/cavra/cli.py"
      - "scripts/validate_ai_red_team.py"
      - "examples/ai-red-team/**"
      - "tests/test_ai_red_team.py"
      - ".github/workflows/ai-red-team.yml"
  workflow_dispatch:
    inputs:
      live_packet:
        description: "Path to a live AI red-team readiness packet"
        required: false
        default: "examples/ai-red-team/enterprise-ai-red-team.live.sanitized.example.json"

jobs:
  ai-red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAVRA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Export AI red-team artifacts
        run: |
          python scripts/validate_ai_red_team.py \
            --export-dir dist/ai-red-team \
            --output dist/ai-red-team-export.json

      - name: Run native LLM guardrail tests
        run: |
          python scripts/validate_ai_red_team.py \
            --suite examples/ai-red-team/guardrail-test-suite.sample.json \
            --output dist/guardrail-run-report.json

      - name: Validate AI supply-chain metadata
        run: |
          python scripts/validate_ai_red_team.py \
            --artifact examples/ai-red-team/ai-artifact-metadata.sample.json \
            --output dist/supply-chain-scan.json

      - name: Confirm invalid AI supply-chain fixture fails
        run: |
          ! python scripts/validate_ai_red_team.py \
            --artifact examples/ai-red-team/ai-artifact-metadata.invalid.json \
            --output dist/invalid-supply-chain-scan.json

      - name: Run malicious model checks
        run: |
          python scripts/validate_ai_red_team.py \
            --malicious-model-checks examples/ai-red-team/ai-artifact-metadata.sample.json \
            --output dist/malicious-model-checks.json

      - name: Confirm invalid malicious model fixture fails
        run: |
          ! python scripts/validate_ai_red_team.py \
            --malicious-model-checks examples/ai-red-team/ai-artifact-metadata.invalid.json \
            --output dist/invalid-malicious-model-checks.json

      - name: Validate sample readiness packet
        run: |
          python scripts/validate_ai_red_team.py \
            --packet examples/ai-red-team/enterprise-ai-red-team.sample.json \
            --output dist/enterprise-ai-red-team-sample.json

      - name: Validate live readiness packet contract
        run: |
          python scripts/validate_ai_red_team.py \
            --packet "${{ github.event.inputs.live_packet || 'examples/ai-red-team/enterprise-ai-red-team.live.sanitized.example.json' }}" \
            --require-live \
            --output dist/enterprise-ai-red-team-live.json

      - name: Run AI red-team tests
        run: python -m pytest tests/test_ai_red_team.py -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-red-team-evidence
          path: dist/
