name: Verify Community Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Community release tag to verify.
        required: true
        default: community-v0.1.2
      version:
        description: Community package version to verify.
        required: true
        default: "0.1.2"
      wheel_sha256:
        description: Expected wheel SHA-256.
        required: true
        default: bbdb2f593ce3c14742446c1682c23bef7933925a02382a874e59b8ef7e389163
      sdist_sha256:
        description: Expected source distribution SHA-256.
        required: true
        default: f7a477cfef65d77bd4c36520a83d256c1086e7b81ffcd9411ee9c68d017ab1d0

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-community-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python scripts/verify-community-release-artifacts.py \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}" \
            --sdist-sha256 "${{ inputs.sdist_sha256 }}"
