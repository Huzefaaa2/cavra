name: Verify Community Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Community release tag to verify.
        required: true
        default: community-v0.1.1
      version:
        description: Community package version to verify.
        required: true
        default: "0.1.1"
      wheel_sha256:
        description: Expected wheel SHA-256.
        required: true
        default: 32ab7a220eb5f25ea5ab42ccbc62a43b7260de12b9a0d3f3d7bdafa1501a5d6a
      sdist_sha256:
        description: Expected source distribution SHA-256.
        required: true
        default: b123c6d2aadd72b055ba916caa68953af94122d34f1215756804d74e91174950

permissions:
  contents: read

jobs:
  verify-community-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/verify-community-release-artifacts.py \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}" \
            --sdist-sha256 "${{ inputs.sdist_sha256 }}"
