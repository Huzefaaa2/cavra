name: Verify Community Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Community release tag to verify.
        required: true
        default: community-v1.0.0-rc.1
      version:
        description: Community package version to verify.
        required: true
        default: "1.0.0rc1"
      wheel_sha256:
        description: Expected wheel SHA-256.
        required: true
        default: 6d06bd04965d3b1340ecacf007bc39111c8a8d5d0a73ee32f44aeb06ebb1be01
      sdist_sha256:
        description: Expected source distribution SHA-256.
        required: true
        default: f4312e51a4d4180387982eafa86f301c584be5af147ba09098d733d187662e0c

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-community-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python scripts/verify-community-release-artifacts.py \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}" \
            --sdist-sha256 "${{ inputs.sdist_sha256 }}"
