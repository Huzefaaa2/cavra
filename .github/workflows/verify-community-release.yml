name: Verify Community Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Community release tag to verify.
        required: true
        default: community-v0.1.0
      version:
        description: Community package version to verify.
        required: true
        default: "0.1.0"
      wheel_sha256:
        description: Expected wheel SHA-256.
        required: true
        default: 1a586ce0fe91af6c24c14b0f8b833d722f9de9e24cfcb1fd81dafc0f016306d8
      sdist_sha256:
        description: Expected source distribution SHA-256.
        required: true
        default: 35370dea724612c8619100db812635c048b91ede65fd905e8d8c189b7c07c26e

permissions:
  contents: read

jobs:
  verify-community-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/verify-community-release-artifacts.py \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}" \
            --sdist-sha256 "${{ inputs.sdist_sha256 }}"
