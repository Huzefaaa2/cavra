name: Verify Community Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Community release tag to verify.
        required: true
        default: community-v1.0.0
      version:
        description: Community package version to verify.
        required: true
        default: "1.0.0"
      wheel_sha256:
        description: Expected wheel SHA-256.
        required: true
        default: "464e7146f74a039b89fe1f163f9b825df7a700942be480c32e611f00fe625914"
      sdist_sha256:
        description: Expected source distribution SHA-256.
        required: true
        default: "851f28a38a6e9df6cbe7637a3963a1dc8eb535478730d3ff3eccf260a025d331"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-community-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python scripts/verify-community-release-artifacts.py \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}" \
            --wheel-sha256 "${{ inputs.wheel_sha256 }}" \
            --sdist-sha256 "${{ inputs.sdist_sha256 }}"
