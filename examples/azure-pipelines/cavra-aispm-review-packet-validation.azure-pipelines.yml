# CAVRA AISPM Review Packet Validation for Azure Pipelines.
#
# Create a pipeline from this YAML file, then add it to the protected branch as
# an Azure Repos Build validation policy named `cavra-aispm-review-packet`.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: governance
    displayName: CAVRA AISPM review packet governance
    jobs:
      - job: cavra_aispm_review_packet
        displayName: cavra-aispm-review-packet
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Set up Python
            inputs:
              versionSpec: "3.11"

          - script: |
              python -m pip install --upgrade pip
              pip install cavra
            displayName: Install CAVRA

          - script: |
              set -euo pipefail
              mkdir -p .cavra/aispm/review-packet-validation

              find . \
                \( -path "./.git" -o -path "./.venv" -o -path "./node_modules" \) -prune -o \
                \( -path "./.cavra/aispm/review-packets/*.json" -o -name "cavra-replay-policy-review-packet.json" \) \
                -type f -print | sort > .cavra/aispm/review-packet-validation/packets.txt

              packet_count="$(wc -l < .cavra/aispm/review-packet-validation/packets.txt | tr -d ' ')"
              if [ "$packet_count" = "0" ]; then
                target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
                target_branch="${target_branch#refs/heads/}"
                if [ -n "$target_branch" ]; then
                  git fetch origin "$target_branch" --depth=1
                  changed_replay_files="$(git diff --name-only "origin/${target_branch}"...HEAD -- 'policies/**' 'tests/fixtures/replay-to-policy/**' || true)"
                  if [ -n "$changed_replay_files" ]; then
                    echo "Replay-derived policy or fixture files changed without a CAVRA review packet."
                    echo "$changed_replay_files"
                    exit 1
                  fi
                fi
                echo "No replay-to-policy review packets found; nothing to validate."
                exit 0
              fi

              while IFS= read -r packet; do
                safe_name="$(echo "$packet" | sed 's#^\./##; s#[^A-Za-z0-9._-]#-#g')"
                cavra aispm validate-review-packet "$packet" --json \
                  | tee ".cavra/aispm/review-packet-validation/${safe_name}.validation.json"
              done < .cavra/aispm/review-packet-validation/packets.txt
            displayName: Validate AISPM replay-to-policy review packets

          - task: PublishPipelineArtifact@1
            displayName: Publish AISPM review packet validation reports
            condition: always()
            inputs:
              targetPath: .cavra/aispm/review-packet-validation
              artifact: cavra-aispm-review-packet-validation
