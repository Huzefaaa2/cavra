syntax = "proto3";

package cavra.enforcement.v1;

service Enforcement {
  rpc Evaluate(EvaluateRequest) returns (DecisionResponse);
}

message EvaluateRequest {
  string session_id = 1;
  string agent_id = 2;
  string actor = 3;
  string action_type = 4;
  string target = 5;
  string requested_operation = 6;
  string policy_pack = 7;
  ReleaseGovernanceEvidence release_governance = 8;
  RunnerAuthentication runner_auth = 9;
}

message DecisionResponse {
  string decision_id = 1;
  string session_id = 2;
  string agent_id = 3;
  string actor = 4;
  string action_type = 5;
  string target = 6;
  string requested_operation = 7;
  string policy_pack = 8;
  string policy_id = 9;
  string rule_id = 10;
  string decision = 11;
  string severity = 12;
  string reason = 13;
  repeated string evidence_refs = 14;
  string approver_group = 15;
  string timestamp = 16;
  string correlation_id = 17;
}

message ReleaseGovernanceEvidence {
  string metadata_kind = 1;
  string release_channel = 2;
  string release_version = 3;
  string approval_state = 4;
  string approval_id = 5;
  int32 approval_required_count = 6;
  bool delivery_success = 7;
  repeated string failed_providers = 8;
  int32 failed_delivery_count = 9;
  int32 connector_delivery_failure_count = 10;
  string alert_level = 11;
  string drift_status = 12;
  string handoff_status = 13;
  int32 blocked_count = 14;
  int32 critical_count = 15;
  int32 breached_count = 16;
  int32 drifted_endpoint_count = 17;
  int32 missing_target_count = 18;
  repeated string evidence_refs = 19;
  string connector_delivery_source = 20;
}

message RunnerAuthentication {
  RunnerIdentity identity = 1;
  string algorithm = 2;
  string key_id = 3;
  string signature = 4;
}

message RunnerIdentity {
  string provider = 1;
  string repository = 2;
  string workflow = 3;
  string run_id = 4;
  string run_attempt = 5;
  string ref = 6;
  string sha = 7;
  string actor = 8;
  string job = 9;
  string runner_name = 10;
}
